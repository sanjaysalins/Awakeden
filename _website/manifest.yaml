  note: Prophecies and patterns written centuries early - Psalm 22, Isaiah 53, Zechariah
    - and the New Testament pointing back at them.
- slug: eyewitness
  title: 'Eyewitness: Old Testament Shadows'
  note: The Bible's own witnesses tell it first-person - the high priest with the
    two goats, Abraham on Moriah, a father in Egypt on Passover night. Every shadow
    lands on Jesus.
- slug: words-from-cross
  title: Words from the Cross
  note: The seven last words of Jesus, and the night before - one piece per word.
- slug: questions-jesus-asked
  title: Questions Jesus Asked
  note: The questions He put to people, and still puts to us. Who do you say I am?
    Why are you afraid?
- slug: i-am-sayings
  title: The I AM Sayings
  note: I am the bread of life, the light of the world, the door, the good shepherd,
    the resurrection, the way, the true vine.
- slug: parables-of-jesus
  title: The Parables of Jesus
  note: 'The stories He told, and the God they reveal: the Father who runs, the kingdom
    hidden in plain sight.'
- slug: miracles-of-jesus
  title: The Miracles of Jesus
  note: What each sign showed about who He is, and what it asks of us now.
- slug: people-who-encountered-jesus
  title: People Who Encountered Jesus
  note: The men and women who met Him in the Gospels and walked away changed.
- slug: titles-of-jesus
  title: Titles of Jesus
  note: The names Scripture gives Him, and what each one reveals.
- slug: kingdom-of-god
  title: The Kingdom of God
  note: What Jesus meant by the kingdom, and how it changes the way we live today.
