[build]
  base = "_website"
  command = "pip install -r requirements.txt && python build_catalog.py && python build_readpage.py --html-only"
  publish = "."

[build.environment]
  PYTHON_VERSION = "3.12"

# Canonical domain is the apex (awakeden.com); Netlify auto-redirects www -> apex.
# Do NOT add an apex -> www rule here: it fights Netlify's redirect and loops.

# The old roadmap page is superseded by The Plan tracker
[[redirects]]
  from = "/roadmap.html"
  to = "/plan.html"
  status = 301
  force = true

# Never serve internal review artifacts
[[redirects]]
  from = "/_independent_review/*"
  to = "/404.html"
  status = 404
  force = true

# Never serve the local design comps / demo media
[[redirects]]
  from = "/_redesign/*"
  to = "/404.html"
  status = 404
  force = true

# Don't serve build/source files at the site root (publish dir is _website/.)
[[redirects]]
  from = "/build_catalog.py"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/build_readpage.py"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/import_catalogue.py"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/make_cutouts.py"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/make_og_cards.py"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/manifest.yaml"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/config.yaml"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/requirements.txt"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/assets/previews/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
