[build]
  base = "_website"
  command = "pip install -r requirements.txt && python build_catalog.py"
  publish = "."

[build.environment]
  PYTHON_VERSION = "3.12"

# Canonical domain is the apex (awakeden.com); Netlify auto-redirects www -> apex.
# Do NOT add an apex -> www rule here: it fights Netlify's redirect and loops.

# Don't serve build/source files at the site root (publish dir is _website/.)
[[redirects]]
  from = "/build_catalog.py"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/manifest.yaml"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/config.yaml"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/requirements.txt"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/assets/previews/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
