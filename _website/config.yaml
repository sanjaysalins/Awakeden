  tagline: "Finding Jesus in the whole Bible, one panel at a time. Every encounter, every prophecy, every promise."
  mission: >
    Awakeden is about finding Jesus in the whole Bible, Old Testament and New,
    the same Lord in both. He is the thread running through all of it: the encounters, the
    prophecies, the promises kept. Every piece is hand-inked and filmed panel
    by panel, with the Scripture in red and quoted exactly (KJV). Watch each one as a short
    film, sit with the longer ones, or read the whole study right here. Some series focus on
    one window: the Old Testament, His miracles, the questions He asked, the people who met
    Him. Serious about the Bible. Clear about the gospel. Made to draw you in, not wear you
    down. The ink is ours. The words are His.

