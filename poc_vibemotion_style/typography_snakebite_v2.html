<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: "BookAntiquaBold"; src: url("file:///C:/Windows/Fonts/BOOKOSB.TTF"); font-weight: 700; }
  @font-face { font-family: "GeorgiaItalic"; src: url("file:///C:/Windows/Fonts/georgiai.ttf"); font-style: italic; }

  html,body { margin:0; padding:0; width:1920px; height:1080px; overflow:hidden; background:#000; }
  .bg {
    position:absolute; top:0; left:0; width:1920px; height:1080px;
    background: url("still_01_snakebite.png") center/cover no-repeat;
  }
  /* very light bottom darken only — the caption band itself carries the text,
     not a UI scrim block */
  .grade {
    position:absolute; left:0; right:0; bottom:0; width:1920px; height:340px;
    background: linear-gradient(180deg, rgba(10,8,6,0) 0%, rgba(10,8,6,0.35) 100%);
  }

  .band-wrap {
    position:absolute; left:10px; bottom:60px; width:1900px; height:260px;
    opacity:0; animation: bandin 0.5s ease forwards; animation-delay:0.05s;
  }
  @keyframes bandin { to { opacity:1; } }
  .band-wrap img { width:100%; height:100%; display:block;
                   filter: drop-shadow(0 10px 18px rgba(0,0,0,0.5)); }

  .ref {
    position:absolute; top:60px; left:74px;
    font-family:"GeorgiaItalic", Georgia, serif; font-style:italic; font-size:28px;
    color:#e9c877; opacity:0;
    animation: fadein 0.8s ease forwards; animation-delay: 0.15s;
    text-shadow: 0 2px 8px rgba(0,0,0,0.7);
  }
  @keyframes fadein { to { opacity:1; } }

  .stage { position:absolute; left:0; right:0; bottom:120px; width:1920px;
           display:flex; justify-content:center; }
  .line { display:flex; gap:22px; flex-wrap:wrap; justify-content:center; max-width:1740px; }
  .word {
    font-family:"BookAntiquaBold", Georgia, serif;
    font-weight:700;
    font-size:88px;
    line-height:1.05;
    color:#2a1c10;
    opacity:0;
    transform: translateY(30px) scale(0.6);
    animation: pop 0.60s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  /* rubrication accent: illuminated-manuscript red ink for the emphasis word,
     no box, no chip -- just the ink colour itself carrying the weight */
  .word.accent { color:#8a2318; text-shadow: 0 0 18px rgba(138,35,24,0.25); }
  @keyframes pop {
    0%   { opacity:0; transform: translateY(30px) scale(0.6); }
    60%  { opacity:1; transform: translateY(-4px) scale(1.06); }
    100% { opacity:1; transform: translateY(0)    scale(1.0); }
  }
  .w0 { animation-delay: 0.10s; } .w1 { animation-delay: 0.26s; }
  .w2 { animation-delay: 0.42s; } .w3 { animation-delay: 0.58s; }
  .w4 { animation-delay: 0.80s; }
</style></head>
<body>
  <div class="bg"></div>
  <div class="grade"></div>
  <div class="ref">Numbers 21:6</div>

  <div class="band-wrap"><img src="caption_band.png"></div>

  <div class="stage">
    <div class="line">
      <span class="word w0">much</span>
      <span class="word w1">people</span>
      <span class="word w2">of</span>
      <span class="word w3">israel</span>
      <span class="word w4 accent">died</span>
    </div>
  </div>
</body></html>
