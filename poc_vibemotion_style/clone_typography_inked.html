<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: "BookAntiquaBold"; src: local("Bookman Old Style"), url("file:///C:/Windows/Fonts/BOOKOSB.TTF"); font-weight: 700; }
  @font-face { font-family: "GeorgiaItalic"; src: local("Georgia Italic"), url("file:///C:/Windows/Fonts/georgiai.ttf"); font-style: italic; }

  html,body { margin:0; padding:0; width:1920px; height:1080px; overflow:hidden; }
  .bg {
    width:1920px; height:1080px;
    background: url("parchment_bg.png") center/cover no-repeat;
  }
  .stage { position:absolute; top:0; left:0; width:1920px; height:1080px;
           display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; }
  .line { display:flex; gap:30px; flex-wrap:wrap; justify-content:center; max-width:1700px; }
  .word {
    font-family:"BookAntiquaBold", Georgia, serif;
    font-weight:700;
    font-size:110px;
    line-height:1.05;
    color:#f4f0d8;
    text-shadow: 0 3px 10px rgba(0,0,0,0.55);
    letter-spacing:0px;
    opacity:0;
    transform: translateY(40px) scale(0.55);
    animation: pop 0.62s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  .word.accent {
    color:#2a1c10;
    background:#c4963e;
    padding:8px 30px;
    border-radius:10px;
    box-shadow: 0 0 40px rgba(196,150,62,0.55), 0 4px 10px rgba(0,0,0,0.4);
    text-shadow:none;
  }
  @keyframes pop {
    0%   { opacity:0; transform: translateY(40px) scale(0.55); }
    60%  { opacity:1; transform: translateY(-6px) scale(1.08); }
    100% { opacity:1; transform: translateY(0)    scale(1.0); }
  }
  .w0 { animation-delay: 0.10s; }
  .w1 { animation-delay: 0.28s; }
  .w2 { animation-delay: 0.46s; }
  .w3 { animation-delay: 0.64s; }
  .w4 { animation-delay: 0.90s; }
</style></head>
<body>
  <div class="bg"></div>
  <div class="stage">
    <div class="line">
      <span class="word w0">For</span>
      <span class="word w1">God</span>
      <span class="word w2 accent">so</span>
      <span class="word w3">loved</span>
    </div>
    <div class="line">
      <span class="word w4">the world</span>
    </div>
  </div>
</body></html>
