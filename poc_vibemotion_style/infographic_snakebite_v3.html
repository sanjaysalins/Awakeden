<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: "GeorgiaItalic"; src: url("file:///C:/Windows/Fonts/georgiai.ttf"); font-style: italic; }
  @font-face { font-family: "GeorgiaBold"; src: url("file:///C:/Windows/Fonts/georgiab.ttf"); font-weight:700; }

  html,body { margin:0; padding:0; width:1920px; height:1080px; overflow:hidden; background:#0b0805; }

  /* two real stills as a genuine comic DIPTYCH -- full-bleed halves, no card
     chrome, divided by a torn ink gutter instead of a rounded border */
  .panel { position:absolute; top:0; width:940px; height:1080px; background-size:cover; background-position:center;
           opacity:0; transform: scale(0.80); }
  .panel1 { left:0;    background-image:url("still_01_snakebite.png"); transform-origin: 30% 50%;
            clip-path: polygon(0 0, 96% 0, 100% 4%, 97% 12%, 100% 22%, 96% 34%, 100% 46%,
                                97% 58%, 100% 70%, 96% 82%, 100% 92%, 97% 100%, 0 100%);
            animation: revealPunch 0.42s cubic-bezier(.2,1.7,.4,1) forwards; animation-delay:0.05s; }
  .panel2 { right:0;   background-image:url("still_04_venom.png"); transform-origin: 70% 50%;
            clip-path: polygon(4% 0, 100% 0, 100% 100%, 3% 100%, 6% 92%, 3% 82%, 7% 70%,
                                4% 58%, 7% 46%, 3% 34%, 6% 22%, 3% 12%, 6% 4%);
            animation: revealPunch 0.42s cubic-bezier(.2,1.7,.4,1) forwards; animation-delay:0.95s; }
  @keyframes revealPunch {
    0%   { opacity:0; transform: scale(0.80); }
    60%  { opacity:1; transform: scale(1.035); }
    100% { opacity:1; transform: scale(1.0); }
  }

  .gutter-ink { position:absolute; top:0; left:930px; width:60px; height:1080px;
                background:#0b0805; z-index:2; }

  /* impact-glow flashes -- one per landing beat, matching the typography clip's punch */
  .glow { position:absolute; width:640px; height:640px; margin-left:-320px; margin-top:-320px;
          border-radius:50%; z-index:1; opacity:0;
          background: radial-gradient(circle, rgba(196,150,62,0.55) 0%, rgba(196,150,62,0) 68%); }
  @keyframes glowflash {
    0%   { opacity:0;   transform:scale(0.55); }
    30%  { opacity:0.95; transform:scale(1.0); }
    100% { opacity:0;   transform:scale(1.35); }
  }
  .glow1 { left:470px;  top:540px; animation: glowflash 0.55s ease-out forwards; animation-delay:0.05s; }
  .glow2 { left:1450px; top:540px; animation: glowflash 0.55s ease-out forwards; animation-delay:0.95s; }
  .glowArrow { left:960px; top:568px; width:420px; height:420px; margin-left:-210px; margin-top:-210px;
               animation: glowflash 0.45s ease-out forwards; animation-delay:0.62s; }

  .arrow-wrap { position:absolute; top:498px; left:830px; width:460px; height:140px; z-index:3;
                opacity:0; transform: scaleX(0.5) translateX(-40px);
                animation: arrowPunch 0.32s cubic-bezier(.2,1.8,.4,1) forwards; animation-delay:0.55s; }
  @keyframes arrowPunch {
    0%   { opacity:0; transform: scaleX(0.5) translateX(-40px); }
    65%  { opacity:1; transform: scaleX(1.08) translateX(6px); }
    100% { opacity:1; transform: scaleX(1.0) translateX(0); }
  }
  .arrow-wrap img { width:100%; filter: drop-shadow(0 0 10px rgba(196,150,62,0.5)) drop-shadow(0 4px 6px rgba(0,0,0,0.6)); }

  .cap {
    position:absolute; z-index:3; width:820px; text-align:center;
    opacity:0; transform: translateY(26px) scale(0.9);
    animation: capPunch 0.4s cubic-bezier(.25,1.5,.4,1) forwards;
  }
  @keyframes capPunch {
    0%   { opacity:0; transform: translateY(26px) scale(0.9); }
    60%  { opacity:1; transform: translateY(-4px) scale(1.03); }
    100% { opacity:1; transform: translateY(0) scale(1.0); }
  }
  .cap1 { left:60px;  bottom:56px; animation-delay: 0.28s; }
  .cap2 { right:60px; bottom:56px; animation-delay: 1.18s; }
  .cap-band { position:relative; }
  .cap-band img { width:100%; height:170px; display:block; filter: drop-shadow(0 8px 14px rgba(0,0,0,0.5)); }
  .cap-text {
    position:absolute; top:0; left:0; width:100%; height:170px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .cap-label { font-family:"GeorgiaBold", Georgia, serif; font-weight:700; font-size:32px; color:#2a1c10; }
  .cap-ref   { font-family:"GeorgiaItalic", Georgia, serif; font-style:italic; font-size:22px; color:#5a3a20; margin-top:6px; }
</style></head>
<body>
  <div class="glow glow1"></div>
  <div class="glow glowArrow"></div>
  <div class="glow glow2"></div>

  <div class="panel panel1"></div>
  <div class="panel panel2"></div>
  <div class="gutter-ink"></div>
  <div class="arrow-wrap"><img src="ink_arrow.png"></div>

  <div class="cap cap1">
    <div class="cap-band">
      <img src="caption_band.png">
      <div class="cap-text">
        <div class="cap-label">FIERY SERPENTS SENT</div>
        <div class="cap-ref">Numbers 21:6</div>
      </div>
    </div>
  </div>
  <div class="cap cap2">
    <div class="cap-band">
      <img src="caption_band.png">
      <div class="cap-text">
        <div class="cap-label">THE VENOM ALREADY WITHIN</div>
        <div class="cap-ref">the narration's own framing</div>
      </div>
    </div>
  </div>
</body></html>
