<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: "BookAntiquaBold"; src: url("file:///C:/Windows/Fonts/BOOKOSB.TTF"); font-weight: 700; }
  @font-face { font-family: "GeorgiaItalic"; src: url("file:///C:/Windows/Fonts/georgiai.ttf"); font-style: italic; }
  @font-face { font-family: "GeorgiaBold"; src: url("file:///C:/Windows/Fonts/georgiab.ttf"); font-weight:700; }

  html,body { margin:0; padding:0; width:1920px; height:1080px; overflow:hidden; background:#000; }
  .bg {
    position:absolute; top:0; left:0; width:1920px; height:1080px;
    background: url("still_01_snakebite.png") center/cover no-repeat;
  }
  .grade {
    position:absolute; left:0; right:0; bottom:0; width:1920px; height:1080px;
    background: radial-gradient(ellipse at 50% 38%, rgba(10,8,6,0) 30%, rgba(10,8,6,0.45) 78%),
                linear-gradient(180deg, rgba(10,8,6,0) 55%, rgba(10,8,6,0.55) 100%);
  }

  /* --- impact glow burst behind the counter, fires once it "lands" --- */
  .impact-glow {
    position:absolute; left:960px; top:330px; width:900px; height:900px;
    margin-left:-450px; margin-top:-450px; border-radius:50%;
    background: radial-gradient(circle, rgba(196,150,62,0.55) 0%, rgba(196,150,62,0) 68%);
    opacity:0; transform:scale(0.6);
  }

  /* --- the counter --- */
  .counter-scrim {
    position:absolute; left:50%; top:120px; width:1000px; height:340px; margin-left:-500px;
    background: radial-gradient(ellipse at center, rgba(8,6,4,0.62) 0%, rgba(8,6,4,0) 72%);
    z-index:2;
  }
  .counter-wrap { position:absolute; left:0; right:0; top:150px; text-align:center; z-index:3; }
  .counter {
    font-family:"BookAntiquaBold", Georgia, serif; font-weight:700;
    font-size:220px; color:#f4f0d8; letter-spacing:4px;
    text-shadow: 0 0 50px rgba(196,150,62,0.65), 0 6px 20px rgba(0,0,0,0.7);
    display:inline-block; min-width:1.2em;
    opacity:0; animation: counterin 0.35s ease forwards; animation-delay:0.15s;
  }
  /* the "no number recorded" placeholder: a drawn ink dash, never a font glyph
     (em-dash glyphs are unreliable across fonts -- this always renders) */
  .counter .dash {
    display:inline-block; width:0.62em; height:0.09em; background:#f4f0d8;
    border-radius:0.05em; vertical-align:0.38em;
    box-shadow: 0 0 40px rgba(196,150,62,0.55);
  }
  @keyframes counterin { to { opacity:1; } }
  .counter-cap {
    font-family:"GeorgiaItalic", Georgia, serif; font-style:italic; font-size:30px;
    color:#f0dfa8; margin-top:6px; text-shadow:0 2px 10px rgba(0,0,0,0.9), 0 0 3px rgba(0,0,0,0.9);
    opacity:0; animation: fadein 0.6s ease forwards; animation-delay:1.15s;
  }
  @keyframes fadein { to { opacity:1; } }

  .ref {
    position:absolute; top:56px; left:74px; z-index:3;
    font-family:"GeorgiaItalic", Georgia, serif; font-style:italic; font-size:30px;
    color:#e9c877; opacity:0;
    animation: fadein 0.8s ease forwards; animation-delay: 0.10s;
    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
  }

  .band-wrap {
    position:absolute; left:10px; bottom:60px; width:1900px; height:260px; z-index:3;
    opacity:0; animation: bandin 0.45s ease forwards; animation-delay:1.30s;
  }
  @keyframes bandin { to { opacity:1; } }
  .band-wrap img { width:100%; height:100%; display:block;
                   filter: drop-shadow(0 10px 18px rgba(0,0,0,0.5)); }

  .stage { position:absolute; left:0; right:0; bottom:120px; width:1920px;
           display:flex; justify-content:center; z-index:4; }
  .line { display:flex; gap:20px; flex-wrap:wrap; justify-content:center; max-width:1740px; }
  .word {
    font-family:"BookAntiquaBold", Georgia, serif;
    font-weight:700;
    font-size:88px;
    line-height:1.05;
    color:#2a1c10;
    opacity:0;
    transform: translateY(46px) scale(0.42);
    animation: pop 0.46s cubic-bezier(.2,1.9,.4,1) forwards;   /* punchier overshoot, faster */
  }
  .word.accent { color:#8a2318; text-shadow: 0 0 22px rgba(138,35,24,0.35); }
  @keyframes pop {
    0%   { opacity:0; transform: translateY(46px) scale(0.42); }
    55%  { opacity:1; transform: translateY(-10px) scale(1.14); }
    78%  { transform: translateY(3px) scale(0.97); }
    100% { opacity:1; transform: translateY(0)    scale(1.0); }
  }
  .w0 { animation-delay: 1.35s; } .w1 { animation-delay: 1.48s; }
  .w2 { animation-delay: 1.61s; } .w3 { animation-delay: 1.74s; }
  .w4 { animation-delay: 1.92s; }
</style></head>
<body>
  <div class="bg"></div>
  <div class="grade"></div>
  <div class="impact-glow" id="glow"></div>
  <div class="counter-scrim"></div>
  <div class="ref">Numbers 21:6</div>

  <div class="counter-wrap">
    <div class="counter" id="counter">000</div>
    <div class="counter-cap">no number is recorded &mdash; Scripture says only &ldquo;much people&rdquo;</div>
  </div>

  <div class="band-wrap"><img src="caption_band.png"></div>
  <div class="stage">
    <div class="line">
      <span class="word w0">much</span>
      <span class="word w1">people</span>
      <span class="word w2">of</span>
      <span class="word w3">israel</span>
      <span class="word w4 accent">died</span>
    </div>
  </div>

<script>
  window.setCounterTime = function(tMs) {
    var el = document.getElementById('counter');
    var glow = document.getElementById('glow');
    var settleAt = 950;
    if (tMs < settleAt) {
      var seed = Math.sin(tMs * 12.9898) * 43758.5453;
      var frac = seed - Math.floor(seed);
      var n = Math.floor(frac * 900) + 100;
      el.textContent = String(n);
      el.style.transform = 'scale(1)';
    } else {
      el.innerHTML = '<span class="dash"></span>';   // drawn ink dash = "no number recorded"
      var since = tMs - settleAt;
      var punch = Math.max(0, 1 - since / 260);
      el.style.transform = 'scale(' + (1 + punch * 0.32) + ')';
      var g = Math.max(0, 1 - since / 500);
      glow.style.opacity = g * 0.9;
      glow.style.transform = 'scale(' + (0.6 + (1 - g) * 0.7) + ')';
    }
  };
</script>
</body></html>
