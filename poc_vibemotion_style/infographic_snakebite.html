<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: "BookAntiquaBold"; src: url("file:///C:/Windows/Fonts/BOOKOSB.TTF"); font-weight: 700; }
  @font-face { font-family: "GeorgiaItalic"; src: url("file:///C:/Windows/Fonts/georgiai.ttf"); font-style: italic; }
  @font-face { font-family: "GeorgiaBold"; src: url("file:///C:/Windows/Fonts/georgiab.ttf"); font-weight:700; }

  html,body { margin:0; padding:0; width:1920px; height:1080px; overflow:hidden; }
  .bg { position:absolute; top:0; left:0; width:1920px; height:1080px;
        background: url("parchment_bg.png") center/cover no-repeat; }

  .title-wrap { position:absolute; top:64px; left:0; right:0; text-align:center;
                opacity:0; animation: fadein 0.9s ease forwards; animation-delay:0.05s; }
  @keyframes fadein { to { opacity:1; } }
  .kicker { font-family:"GeorgiaItalic", Georgia, serif; font-style:italic; font-size:28px; color:#e9c877; letter-spacing:2px; }
  .title  { font-family:"BookAntiquaBold", Georgia, serif; font-weight:700; font-size:58px; color:#f4f0d8;
            text-shadow:0 2px 10px rgba(0,0,0,0.6); margin-top:6px; }

  .node {
    position:absolute; top:300px; width:620px; height:460px;
    border-radius:14px; overflow:hidden;
    box-shadow: 0 0 0 4px #2a1c10, 0 0 0 7px #c4963e, 0 18px 40px rgba(0,0,0,0.55);
    opacity:0; transform: scale(0.82);
    animation: reveal 0.7s cubic-bezier(.34,1.46,.64,1) forwards;
  }
  @keyframes reveal { to { opacity:1; transform: scale(1); } }
  .node1 { left:120px;  background: url("still_01_snakebite.png") center/cover no-repeat; animation-delay: 0.35s; }
  .node2 { right:120px; background: url("still_04_venom.png")     center/cover no-repeat; animation-delay: 1.55s; }

  .plaque {
    position:absolute; top:800px; width:620px; text-align:center;
    opacity:0; animation: fadein 0.6s ease forwards;
  }
  .plaque1 { left:120px;  animation-delay: 0.75s; }
  .plaque2 { right:120px; animation-delay: 1.95s; }
  .plaque-label { font-family:"GeorgiaBold", Georgia, serif; font-weight:700; font-size:34px; color:#f4f0d8;
                  background:rgba(20,14,9,0.55); display:inline-block; padding:10px 26px; border-radius:10px;
                  border:2px solid rgba(196,150,62,0.55); }
  .plaque-ref { font-family:"GeorgiaItalic", Georgia, serif; font-style:italic; font-size:24px; color:#c4963e;
                margin-top:12px; }

  .connector { position:absolute; top:0; left:0; width:1920px; height:1080px; overflow:visible; }
  .connector path {
    fill:none; stroke:#c4963e; stroke-width:6; stroke-linecap:round;
    stroke-dasharray: 12 14;
    stroke-dashoffset: 1100; /* full path length, hides the line */
    filter: drop-shadow(0 0 10px rgba(196,150,62,0.55));
    animation: draw 1.0s cubic-bezier(.4,0,.2,1) forwards;
    animation-delay: 1.05s;
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .arrowhead {
    opacity:0; animation: fadein 0.25s ease forwards; animation-delay: 2.0s;
  }
</style></head>
<body>
  <div class="bg"></div>

  <div class="title-wrap">
    <div class="kicker">THE JUDGMENT ARRIVES</div>
    <div class="title">THE FIERY SERPENTS</div>
  </div>

  <div class="node node1"></div>
  <div class="node node2"></div>

  <svg class="connector" viewBox="0 0 1920 1080">
    <path d="M 760,530 L 1160,530" />
    <polygon class="arrowhead" points="1160,530 1130,514 1130,546" fill="#c4963e"/>
  </svg>

  <div class="plaque plaque1">
    <div class="plaque-label">FIERY SERPENTS SENT</div>
    <div class="plaque-ref">Numbers 21:6</div>
  </div>
  <div class="plaque plaque2">
    <div class="plaque-label">THE VENOM ALREADY WITHIN</div>
    <div class="plaque-ref">the camp's narration</div>
  </div>
</body></html>
