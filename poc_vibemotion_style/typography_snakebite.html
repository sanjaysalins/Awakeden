<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: "BookAntiquaBold"; src: url("file:///C:/Windows/Fonts/BOOKOSB.TTF"); font-weight: 700; }
  @font-face { font-family: "GeorgiaItalic"; src: url("file:///C:/Windows/Fonts/georgiai.ttf"); font-style: italic; }

  html,body { margin:0; padding:0; width:1920px; height:1080px; overflow:hidden; background:#000; }
  .bg {
    position:absolute; top:0; left:0; width:1920px; height:1080px;
    background: url("still_01_snakebite.png") center/cover no-repeat;
  }
  .scrim {
    position:absolute; left:0; right:0; bottom:0; width:1920px; height:620px;
    background: linear-gradient(180deg, rgba(10,8,6,0) 0%, rgba(10,8,6,0.55) 45%, rgba(10,8,6,0.92) 100%);
  }
  .ref {
    position:absolute; top:56px; left:70px;
    font-family:"GeorgiaItalic", Georgia, serif; font-style:italic; font-size:30px;
    color:#e9c877; opacity:0;
    animation: fadein 0.8s ease forwards; animation-delay: 0.15s;
    text-shadow: 0 2px 8px rgba(0,0,0,0.7);
  }
  @keyframes fadein { to { opacity:1; } }

  .stage { position:absolute; left:0; right:0; bottom:90px; width:1920px;
           display:flex; justify-content:center; }
  .line { display:flex; gap:24px; flex-wrap:wrap; justify-content:center; max-width:1740px; }
  .word {
    font-family:"BookAntiquaBold", Georgia, serif;
    font-weight:700;
    font-size:96px;
    line-height:1.05;
    color:#f4f0d8;
    text-shadow: 0 4px 14px rgba(0,0,0,0.75);
    opacity:0;
    transform: translateY(40px) scale(0.55);
    animation: pop 0.62s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  .word.accent {
    color:#2a1c10;
    background:#c4963e;
    padding:6px 26px;
    border-radius:10px;
    box-shadow: 0 0 40px rgba(196,150,62,0.55), 0 4px 10px rgba(0,0,0,0.4);
    text-shadow:none;
  }
  @keyframes pop {
    0%   { opacity:0; transform: translateY(40px) scale(0.55); }
    60%  { opacity:1; transform: translateY(-6px) scale(1.08); }
    100% { opacity:1; transform: translateY(0)    scale(1.0); }
  }
  .w0 { animation-delay: 0.10s; } .w1 { animation-delay: 0.26s; }
  .w2 { animation-delay: 0.42s; } .w3 { animation-delay: 0.58s; }
  .w4 { animation-delay: 0.80s; }
</style></head>
<body>
  <div class="bg"></div>
  <div class="scrim"></div>
  <div class="ref">NUMBERS 21:6</div>
  <div class="stage">
    <div class="line">
      <span class="word w0">much</span>
      <span class="word w1">people</span>
      <span class="word w2">of</span>
      <span class="word w3">israel</span>
      <span class="word w4 accent">died</span>
    </div>
  </div>
</body></html>
