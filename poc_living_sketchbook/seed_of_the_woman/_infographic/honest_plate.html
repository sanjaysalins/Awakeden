<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
/* s32 "Honest Match" plate -- 7.52s (204.19-211.71), 1920x1080@30
   Design: Fable, 2026-08-08. Deliberate style-break infographic insert
   (memory feedback-infographic-insert-override) -- the ONLY two spreads
   in this episode allowed off the sketchbook grammar. Palette/timing
   doctrine: gold NEVER appears here (reserved for "the Son of God" on
   the naming plate); no red (red-letter reserved for the LORD's own
   speech, s22); KJV/quote arrivals are WHOLE-block only (LAW 1) -- not
   used in this spread since no KJV is quoted here, but the same
   letterpress-whole-press grammar carries the labels/titles instead.
   Font: Constantia (Windows-installed, zero-download, serif register). */

@font-face { font-family: 'PlateSerif'; src: url('file:///C:/Windows/Fonts/constan.ttf'); font-weight: 400; }
@font-face { font-family: 'PlateSerif'; src: url('file:///C:/Windows/Fonts/constanb.ttf'); font-weight: 700; }

* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1920px; height:1080px; overflow:hidden; background:#1B1613; }

.field {
  position:absolute; inset:0;
  background:#1B1613;
}
/* grain: SVG turbulence, screen-blended, very low opacity -- no frame ever fully dead */
.grain {
  position:absolute; inset:-40px;
  opacity:0.05; mix-blend-mode:screen; pointer-events:none;
  animation: drift 9s linear infinite;
}
@keyframes drift {
  0%   { transform:translate(0,0); }
  50%  { transform:translate(-8px,4px); }
  100% { transform:translate(0,0); }
}
.vignette {
  position:absolute; inset:0; pointer-events:none;
  background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,0.38) 100%);
  animation: breathe 9s ease-in-out infinite;
}
@keyframes breathe {
  0%,100% { opacity:1; }
  50%     { opacity:0.94; }
}

.body-outer { position:absolute; top:0; height:1080px; width:640px; }
.body-outer.left  { left:110px;  animation: driftLeft 7.52s linear forwards; }
.body-outer.right { left:1170px; animation: driftRight 7.52s linear forwards; }
@keyframes driftLeft  { from { transform:translateX(0); } to { transform:translateX(-20px); } }
@keyframes driftRight { from { transform:translateX(0); } to { transform:translateX(20px); } }

.body-inner {
  position:absolute; top:430px; width:640px; text-align:center;
  filter: blur(1.5px); opacity:0;
}
.left  .body-inner { animation: pressLeft  7.52s linear forwards; }
.right .body-inner { animation: pressRight 7.52s linear forwards; }

/* percentages of 7.52s: press-in complete by 0.63s (8.38%), settle bump
   at 1.57s (20.88%), second press-settle ("Genesis") at 6.06s (80.59%) */
@keyframes pressLeft {
  0%      { opacity:0; filter:blur(1.5px); transform:scale(1.03); }
  4.65%   { opacity:0; filter:blur(1.5px); transform:scale(1.03); }
  8.38%   { opacity:1; filter:blur(0);     transform:scale(1.0);  }
  18.75%  { transform:scale(1.0);   }
  20.88%  { transform:scale(1.012); }
  23.00%  { transform:scale(1.0);   }
  79.00%  { transform:scale(1.0);   }
  80.59%  { transform:scale(0.988); }
  82.45%  { transform:scale(1.0);   }
  100%    { opacity:1; filter:blur(0); transform:scale(1.0); }
}
@keyframes pressRight {
  0%      { opacity:0; filter:blur(1.5px); transform:scale(1.03); }
  6.65%   { opacity:0; filter:blur(1.5px); transform:scale(1.03); }
  10.37%  { opacity:1; filter:blur(0);     transform:scale(1.0);  }
  18.75%  { transform:scale(1.0);   }
  20.88%  { transform:scale(1.012); }
  23.00%  { transform:scale(1.0);   }
  100%    { opacity:1; filter:blur(0); transform:scale(1.0); }
}

.label {
  font-family:'PlateSerif',serif; font-weight:700; font-size:34px;
  letter-spacing:0.18em; color:#948A7C; text-transform:uppercase;
  margin-bottom:22px;
}
.main {
  font-family:'PlateSerif',serif; font-weight:400; font-size:76px;
  letter-spacing:0.02em; color:#EAE0C9;
}
.rule {
  width:260px; height:1px; background:#948A7C; margin:34px auto 0;
  transform-origin:left center; transform:scaleX(0);
  animation: drawRule 0.4s ease-out 0.90s forwards;
}
@keyframes drawRule { to { transform:scaleX(1); } }

/* the failed citation line: draws from x740 to x940 (3.64s-5.04s = 1.4s),
   then un-inks right-to-left (6.00s-7.20s = 1.2s) via clip-path */
.citation-line {
  position:absolute; top:544px; left:740px; width:200px; height:2px;
  background:#948A7C;
  clip-path: inset(0 100% 0 0);
  animation: drawLine 1.4s ease-out 3.64s forwards,
             recoil 0.18s ease-out 4.94s forwards,
             uninkLine 1.2s ease-in 6.00s forwards;
}
@keyframes drawLine  { to { clip-path: inset(0 0% 0 0); } }
@keyframes recoil    { 0% { transform:translateX(0); } 60% { transform:translateX(-8px); } 100% { transform:translateX(0); } }
@keyframes uninkLine  { to { clip-path: inset(0 0% 0 100%); opacity:0.3; } }

.mote {
  position:absolute; top:543px; width:2px; height:2px; border-radius:50%;
  background:#948A7C; opacity:0;
}
.mote1 { left:900px; animation: fallMote 0.8s ease-in 6.10s forwards; }
.mote2 { left:860px; animation: fallMote 0.8s ease-in 6.35s forwards; }
.mote3 { left:820px; animation: fallMote 0.8s ease-in 6.60s forwards; }
.mote4 { left:780px; animation: fallMote 0.8s ease-in 6.85s forwards; }
@keyframes fallMote {
  0%   { opacity:0.55; transform:translateY(0); }
  100% { opacity:0;    transform:translateY(16px); }
}
</style>
</head>
<body>
<div class="field"></div>
<svg class="grain" width="2000" height="1160">
  <filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/></filter>
  <rect width="100%" height="100%" filter="url(#n)"/>
</svg>

<div class="body-outer left">
  <div class="body-inner">
    <div class="label">The Promise</div>
    <div class="main">Genesis 3:15</div>
    <div class="rule"></div>
  </div>
</div>

<div class="body-outer right">
  <div class="body-inner">
    <div class="label">The Witness</div>
    <div class="main">Matthew&nbsp;&ndash;&nbsp;Revelation</div>
    <div class="rule"></div>
  </div>
</div>

<div class="citation-line"></div>
<div class="mote mote1"></div>
<div class="mote mote2"></div>
<div class="mote mote3"></div>
<div class="mote mote4"></div>

<div class="vignette"></div>
</body>
</html>
