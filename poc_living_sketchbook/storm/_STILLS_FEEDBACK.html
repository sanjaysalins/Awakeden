<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STORM stills — notes</title>
<style>
  body { background:#16181d; color:#e8e4d8; font-family:Georgia, serif; line-height:1.5; padding:24px 18px 140px; }
  .wrap { max-width:900px; margin:0 auto; }
  h1 { color:#e9c877; font-size:1.6rem; margin-bottom:6px; }
  .sub { color:#9aa0ad; margin-bottom:20px; font-size:.95rem; }
  .card { background:#1e2129; border-left:5px solid #333a47; border-radius:8px; padding:16px 18px; margin:18px 0; }
  .card.noted { border-left-color:#e9c877; }
  .name { color:#e9c877; font-family:Arial, sans-serif; font-weight:bold; font-size:1.05rem; margin-bottom:2px; }
  .desc { color:#9aa0ad; font-size:.9rem; margin-bottom:10px; }
  img { width:100%; max-width:420px; display:block; border-radius:6px; border:1px solid #333a47; margin-bottom:10px; }
  textarea {
    width:100%; max-width:420px; min-height:70px; background:#101216; color:#e8e4d8;
    border:1px solid #333a47; border-radius:6px; padding:10px; font-family:Arial, sans-serif;
    font-size:.95rem; resize:vertical; box-sizing:border-box;
  }
  textarea:focus { outline:1px solid #e9c877; }
  .bar {
    position:fixed; bottom:0; left:0; right:0; background:#0e0f12; border-top:1px solid #333a47;
    padding:14px 18px; display:flex; gap:12px; align-items:center; flex-wrap:wrap;
  }
  button {
    background:#e9c877; color:#16181d; border:none; border-radius:6px; padding:10px 18px;
    font-family:Arial, sans-serif; font-weight:bold; font-size:.95rem; cursor:pointer;
  }
  button:hover { background:#f2d68f; }
  button.secondary { background:#333a47; color:#e8e4d8; }
  #status { color:#7fc97f; font-family:Arial, sans-serif; font-size:.9rem; }
</style>
</head>
<body>
<div class="wrap">
<h1>STORM v2 — notes on the stills</h1>
<div class="sub">Type notes on whichever stills need changing, leave the rest blank. Notes auto-save
in this browser as you type. When done, click "Copy all notes" and paste them back into the chat.</div>

<div id="cards"></div>
</div>

<div class="bar">
  <button onclick="copyNotes()">Copy all notes</button>
  <button class="secondary" onclick="clearNotes()">Clear all</button>
  <span id="status"></span>
</div>

<script>
const STILLS = [
  ["s01_waves", "Wide storm shot, no figures, boat alone in heavy swell"],
  ["s02_water", "Close on feet + rope, water in the boat"],
  ["s03_screaming", "3 disciples straining at oars, storm behind"],
  ["s04_asleep", "Jesus asleep in the stern, warm lamp glow"],
  ["s05_hands", "Close on Jesus's resting hand, storm blurred behind"],
  ["s06_shaken", "Disciple's hand grips Jesus's shoulder to wake him"],
  ["s07_eyes", "Jesus's eyes opening, calm close portrait"],
  ["s08_verse", "Jesus seated, mid-speech — SCRIBED INK verse card here"],
  ["s09_rebuke", "Jesus standing, arm out, rebuking the storm — 3 disciples watching"],
  ["s10_calm", "Same shot, storm now calm, disciples seated"],
  ["s11_exactly", "Wide calm sea, boat in the distance — INK STAMP \"EXACTLY.\""],
  ["s12_knees", "Fisherman close portrait, water at his ankles"],
  ["s13_landing", "Torn-page landing, Jesus silhouette in gold light"],
];

const KEY = "storm_stills_notes";

function loadNotes() {
  try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { return {}; }
}
function saveNotes(notes) {
  localStorage.setItem(KEY, JSON.stringify(notes));
}

function render() {
  const notes = loadNotes();
  const root = document.getElementById("cards");
  root.innerHTML = "";
  STILLS.forEach(([name, desc]) => {
    const card = document.createElement("div");
    card.className = "card" + (notes[name] ? " noted" : "");
    card.id = "card_" + name;
    card.innerHTML = `
      <div class="name">${name}</div>
      <div class="desc">${desc}</div>
      <img src="stills/${name}.png" loading="lazy">
      <textarea placeholder="notes for ${name}...">${notes[name] || ""}</textarea>
    `;
    const ta = card.querySelector("textarea");
    ta.addEventListener("input", () => {
      const n = loadNotes();
      if (ta.value.trim()) { n[name] = ta.value; card.classList.add("noted"); }
      else { delete n[name]; card.classList.remove("noted"); }
      saveNotes(n);
    });
    root.appendChild(card);
  });
}

function copyNotes() {
  const notes = loadNotes();
  const lines = STILLS
    .filter(([name]) => notes[name] && notes[name].trim())
    .map(([name]) => `${name}: ${notes[name].trim()}`);
  const text = lines.length ? lines.join("\n") : "(no notes yet)";
  navigator.clipboard.writeText(text).then(() => {
    document.getElementById("status").textContent = "Copied " + lines.length + " note(s) — paste into chat.";
  }, () => {
    document.getElementById("status").textContent = "Copy failed — select text manually.";
  });
}

function clearNotes() {
  if (confirm("Clear all notes?")) {
    localStorage.removeItem(KEY);
    render();
    document.getElementById("status").textContent = "";
  }
}

render();
</script>
</body>
</html>
