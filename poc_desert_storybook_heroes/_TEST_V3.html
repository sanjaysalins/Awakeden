<!doctype html><html><head><meta charset="utf-8"><title>New Look Test</title>
<style>body{font-family:Verdana,sans-serif;background:#f6efe4;color:#2b2218;padding:20px;font-size:20px}
.row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:28px}.c{flex:1;min-width:220px;background:#fff;padding:10px;border-radius:12px}
.c img{width:100%;border-radius:8px;cursor:zoom-in}b{font-size:22px}
#z{display:none;position:fixed;inset:0;background:#000d;align-items:center;justify-content:center}#z img{max-height:96vh;max-width:96vw}</style></head><body>
<h1>New look — test 2</h1>
<div class="row">
<div class="c"><img src="refs/pin/look.jpg"><b>Your new look</b></div>
<div class="c"><img src="v3/01_well.png"><b>Well — new</b><br>Closer. Not stretched enough.</div>
<div class="c"><img src="v3/02_storm.png"><b>Storm — new</b><br>Closest yet. Eyes a bit too wide.</div>
</div>
<div class="row">
<div class="c"><img src="01_well.png"><b>Well — first try</b></div>
<div class="c"><img src="02_storm.png"><b>Storm — first try</b></div>
</div>
<div id="z" onclick="this.style.display='none'"><img></div>
<script>document.querySelectorAll('.c img').forEach(i=>i.onclick=()=>{z.querySelector('img').src=i.src;z.style.display='flex'})</script>
</body></html>
