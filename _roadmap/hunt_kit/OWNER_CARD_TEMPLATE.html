<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Owner card {CARD}</title>
<!-- owner_card.py fills the {SLOTS}. No scripts. Light + dark by CSS variables. -->
<style>
:root{--bg:#fbf8f1;--fg:#1d1a16;--card:#fff;--line:#d9d0bd;--accent:#8a4b0f;--ok:#17653a;--mute:#6b6254}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#17140f;--fg:#f3ecdc;--card:#241f17;--line:#4a4132;--accent:#e8b062;--ok:#6fd49a;--mute:#b3a68e}}
:root[data-theme=dark]{--bg:#17140f;--fg:#f3ecdc;--card:#241f17;--line:#4a4132;--accent:#e8b062;--ok:#6fd49a;--mute:#b3a68e}
body{margin:0;background:var(--bg);color:var(--fg);font:22px/1.5 Verdana,Arial,sans-serif;padding:16px}
main{max-width:980px;margin:0 auto}
h1{font-size:40px;line-height:1.2;margin:.3em 0}
.small{color:var(--mute);font-size:18px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:20px 0}
@media (max-width:700px){.pair{grid-template-columns:1fr}}
.v{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:16px}
.v b{color:var(--accent);font-size:24px;display:block;margin-bottom:6px}
.box{background:var(--card);border-left:8px solid var(--accent);border-radius:8px;padding:12px 16px;margin:16px 0}
.label{display:inline-block;background:var(--accent);color:var(--bg);font-weight:bold;padding:2px 14px;border-radius:20px}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--line);padding:6px 10px;text-align:left}
.q{font-size:34px;font-weight:bold;text-align:center;margin:36px 0 8px}
.yn{display:flex;gap:20px;justify-content:center;font-size:34px;font-weight:bold}
.yn span{border:3px solid var(--ok);border-radius:14px;padding:10px 40px;color:var(--ok)}
</style></head><body><main>
<p class="small">{TOPIC} - card {CARD} - {PASSAGE}</p>
<p class="q">Had you seen this before?</p>
<div class="yn"><span>YES</span><span>NO</span></div>
<p class="small" style="text-align:center">Words are not written until you say NO (it is new to you).</p>
<h1>{INSIGHT}</h1>
<div class="pair">
<div class="v"><b>{REF1}</b>{TEXT1}</div>
<div class="v"><b>{REF2}</b>{TEXT2}</div>
</div>
<div class="box"><b>Why these two belong together: {WHY}</b></div>
<p><span class="label">{LABEL}</span></p>
<div class="box"><b>What this does NOT prove</b><br>{NOT}</div>
<h2>Checks (after you answer)</h2>
{SCORES}
</main></body></html>
