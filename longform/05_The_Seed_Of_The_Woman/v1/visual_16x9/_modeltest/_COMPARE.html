<!doctype html><html><head><meta charset=utf-8><title>S20 model compare</title>
<style>body{background:#0d0d0d;color:#eee;font-family:system-ui;margin:0;padding:24px}
h1{color:#d8b87a}.row{display:flex;gap:14px;flex-wrap:wrap}
.c{flex:1;min-width:380px;background:#1a1a1a;border-radius:8px;overflow:hidden;cursor:zoom-in}
.c img{width:100%;display:block}.c h3{margin:0;padding:8px 10px;color:#d8b87a}.c p{margin:0;padding:0 10px 10px;font-size:13px;color:#aaa}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.95);display:none;align-items:center;justify-content:center;cursor:zoom-out;z-index:9}
#lb.on{display:flex}#lb img{max-width:97vw;max-height:95vh}</style></head><body>
<h1>S20 "the turn" — before / after (click to zoom)</h1>
<div class=row>
<figure class=c onclick="z(this)" data-s="S20_nano_banana_CURRENT.png"><h3>BEFORE — Nano Banana Pro</h3><img src="S20_nano_banana_CURRENT.png"><p>current batch · character model · cramped cross on a rock, flat</p></figure>
<figure class=c onclick="z(this)" data-s="S20_soul_cinematic.png"><h3>AFTER — Soul Cinematic</h3><img src="S20_soul_cinematic.png"><p>cinematic model · epic god-rays, towering central cross · BUT bare-torso (veo NSFW) + photoreal</p></figure>
<figure class=c onclick="z(this)" data-s="S20_cinematic_studio_2_5.png"><h3>AFTER — Cinematic Studio 2.5</h3><img src="S20_cinematic_studio_2_5.png"><p>painterly + robed (veo-safe) · atmospheric · BUT figure standing not crucified, less drama</p></figure>
</div>
<div id=lb onclick="this.classList.remove('on')"><img id=li></div>
<script>function z(f){document.getElementById('li').src=f.dataset.s;document.getElementById('lb').classList.add('on')}</script>
</body></html>
