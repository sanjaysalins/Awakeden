<!doctype html><meta charset=utf-8>
<title>Painted-comic colour spectrum — muted / slight / full</title>
<style>
 body{background:#14110d;color:#efe7d6;font-family:system-ui,Arial;margin:0;padding:24px}
 h1{font-size:22px;margin:0 0 4px} p.sub{color:#b7ab97;margin:0 0 24px;max-width:900px}
 h2{color:#e9c877;font-size:16px;margin:28px 0 10px;border-bottom:1px solid #33291a;padding-bottom:6px}
 .row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
 @media(max-width:1000px){.row{grid-template-columns:1fr}}
 figure{margin:0} figcaption{font-size:13px;color:#e9c877;font-weight:700;margin:0 0 6px}
 img{width:100%;border-radius:7px;display:block;border:2px solid #000;box-shadow:0 4px 16px rgba(0,0,0,.5)}
</style>
<h1>Same style, three colour levels</h1>
<p class="sub">Same painted-comic recipe (bold ink, dry-brush, chiaroscuro) throughout. Only the colour
instruction changes: fully muted sepia, a touch of natural colour, or full rich colour.</p>

<h2>Christ portrait</h2>
<div class="row">
<figure><figcaption>MUTED</figcaption><img src="christ_pc_ref_REPRO_v3_2.png"></figure>
<figure><figcaption>SLIGHT COLOUR</figcaption><img src="_round4/05_christ_portrait_colour.png"></figure>
<figure><figcaption>FULL COLOUR</figcaption><img src="_round4/07_christ_portrait_fullcolour.png"></figure>
</div>

<h2>Scene 1 — tabernacle + crowd</h2>
<div class="row">
<figure><figcaption>MUTED</figcaption><img src="_round4/04_scene1_muted.png"></figure>
<figure><figcaption>SLIGHT COLOUR</figcaption><img src="_round4/06_scene1_colour.png"></figure>
<figure><figcaption>FULL COLOUR</figcaption><img src="_round4/08_scene1_fullcolour.png"></figure>
</div>
