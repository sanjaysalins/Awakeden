a rocky hilltop lookout above terraced valleys and distant walled towns trembling between empires, far smoke on the horizon, a wide tense sky and long shadows over the kingdom seen from above</div></figcaption></figure><figure><img src="places/MOUNT_HOR.png" loading="lazy"><figcaption><b>MOUNT_HOR</b> <span class="blk">plate</span><div class="c">Mount Hor on the bitter desert road: a stark rocky desert mountain of bare sun-scorched stone rising from a wasteland of dust and shattered rock, a thin hard wind and a pale glaring sky, a desolate height on the edge of the wilderness wandering</div></figcaption></figure><figure><img src="places/MOUNT_MORIAH.png" loading="lazy"><figcaption><b>MOUNT_MORIAH</b> <span class="blk">plate</span><div class="c">the mountain in the land of Moriah seen afar off: a lone rocky summit rising above barren ridges, bare grey stone and scattered thornbrush on its slopes, a hard clear sky overhead, the appointed high place of the offering, solemn and remote</div></figcaption></figure><figure><img src="places/MOUNTAIN_FOOT.png" loading="lazy"><figcaption><b>MOUNTAIN_FOOT</b> <span class="blk">plate</span><div class="c">the base of a barren mountain in the land of Moriah: a stony lower slope of scattered boulders and dry thornscrub where a waiting party might rest, the great rock rising steeply above, a hard clear sky and quiet shadow at the foot of the height</div></figcaption></figure><figure><img src="places/MUDBRICK_HOUSE.png" loading="lazy"><figcaption><b>MUDBRICK_HOUSE</b> <span class="blk">plate</span><div class="c">a slave family&#x27;s mud-brick dwelling in the land of bondage, shut for the night: a single cramped earthen room with rough plastered walls and a low timber-beamed roof, a packed dirt floor and a barred plank door, faint lamplight in close darkness</div></figcaption></figure><figure><img src="places/NINEVEH.png" loading="lazy"><figcaption><b>NINEVEH</b> <span class="blk">plate</span><div class="c">the great wicked Assyrian city of Nineveh: colossal fortified walls and massive winged-bull gates of carved stone, ziggurat temples and crowded flat-roofed quarters beyond, banners and idols, a hard imposing grandeur under a heavy oppressive sky</div></figcaption></figure><figure><img src="places/POOL_OF_BETHESDA.png" loading="lazy"><figcaption><b>POOL_OF_BETHESDA</b> <span class="blk">plate</span><div class="c">the five-porched pool of Bethesda in ancient Jerusalem: a great rectangular stone reservoir ringed by five weathered colonnaded porticoes, worn flagstones and shadowed arches, the dark water faintly stirring and troubled, dim cool light under high stone columns</div></figcaption></figure><figure><img src="places/ROAD.png" loading="lazy"><figcaption><b>ROAD</b> <span class="blk">plate</span><div class="c">a long dusty country road home at dusk: a worn track crossing open fields and golden stubble toward a distant farmstead, low fences and scattered trees, the warm fading light of evening laid long across the land, quiet and waiting</div></figcaption></figure><figure><img src="places/SAMARIA_TOWN.png" loading="lazy"><figcaption><b>SAMARIA_TOWN</b> <span class="blk">plate</span><div class="c">an ancient Samaritan village on a hill: clustered mud-brick and rough-stone houses with flat roofs along a dusty hillside lane, low terrace walls and a few olive trees, the dry tan slopes of Samaria around it under hard bright daylight</div></figcaption></figure><figure><img src="places/SHEEPFOLD.png" loading="lazy"><figcaption><b>SHEEPFOLD</b> <span class="blk">plate</span><div class="c">an ancient hillside sheepfold of dry-stacked stone: a rough circular pen of piled fieldstones with a single narrow gap and no gate, trodden earth within, scrubby slope and scattered rocks around it, the soft light of evening over a quiet pastoral hill</div></figcaption></figure><figure><img src="places/SHORE.png" loading="lazy"><figcaption><b>SHORE</b> <span class="blk">plate</span><div class="c">a misty Sea of Galilee shoreline at sunrise: pale wet sand and smooth shore stones meeting still grey water, soft golden light breaking through low morning haze, distant quiet hills, a calm and washed stillness over the beach</div></figcaption></figure><figure><img src="places/STORM_SEA.png" loading="lazy"><figcaption><b>STORM_SEA</b> <span class="blk">plate</span><div class="c">the Sea of Galilee in violent night tempest: black heaving water reared into towering whitecaps, lashing rain and wind-driven spray, a low churning sky split by faint lightning, no shore in sight, the deep raging and breaking white in the dark</div></figcaption></figure><figure><img src="places/STORMY_SEA.png" loading="lazy"><figcaption><b>STORMY_SEA</b> <span class="blk">plate</span><div class="c">the raging open deep that swallows a ship&#x27;s course: vast black storm-driven swells heaving to the horizon, foam streaking off the wave-crests in a howling wind, a low bruised sky of torn cloud, the sea wild and merciless with no land in sight</div></figcaption></figure><figure><img src="places/TABERNACLE_DOOR.png" loading="lazy"><figcaption><b>TABERNACLE_DOOR</b> <span class="blk">plate</span><div class="c">the entrance of the wilderness tabernacle: the open doorway in the linen-curtained outer court, embroidered blue-and-scarlet hangings drawn back on acacia posts, the bronze altar and laver beyond on bare desert sand, warm daylight at the threshold of the sanctuary</div></figcaption></figure><figure><img src="places/TABERNACLE_INTERIOR.png" loading="lazy"><figcaption><b>TABERNACLE_INTERIOR</b> <span class="blk">plate</span><div class="c">the inner Most Holy Place of the wilderness tabernacle within the veil: NO lampstand here (the lampstand stood outside in the Holy Place), the golden ark and overshadowing cherubim lit only by the dim glow of the divine Presence and drifting incense smoke, deep sacred shadow all around</div></figcaption></figure><figure><img src="places/TEMPLE.png" loading="lazy"><figcaption><b>TEMPLE</b> <span class="blk">plate</span><div class="c">the courts of Herod&#x27;s temple in ancient Jerusalem at night: vast polished golden-stone pavements and towering colonnaded walls, great pillars and broad steps lit by the warm glow of standing lamps and torches against deep darkness, sacred and grand</div></figcaption></figure><figure><img src="places/THRESHING_FLOOR.png" loading="lazy"><figcaption><b>THRESHING_FLOOR</b> <span class="blk">plate</span><div class="c">an ancient hilltop threshing floor at night: a broad flat circle of swept hard-packed stone open to the wind, heaped winnowed grain and scattered straw at its edge, a winnowing fork leaning by the pile, cool blue moonlight over the quiet harvest ground</div></figcaption></figure><figure><img src="places/WASHED_EARTH.png" loading="lazy"><figcaption><b>WASHED_EARTH</b> <span class="blk">plate</span><div class="c">the clean new world after the flood receded: glistening rain-washed hillsides of fresh wet earth and bright new green, pools and rivulets draining away, low scattered mist lifting under a clearing sky touched by a faint rainbow, a world made new and still</div></figcaption></figure><figure><img src="places/WELL.png" loading="lazy"><figcaption><b>WELL</b> <span class="blk">plate</span><div class="c">ancient Jacob&#x27;s well outside Sychar at noon: a low round mouth of worn stone over a deep shaft on a dusty open plain, deep and dark with nothing to draw with at its rim, dry scrub and distant tan hills around it under a harsh white midday sun and short hard shadows</div></figcaption></figure><figure><img src="places/WILDERNESS.png" loading="lazy"><figcaption><b>WILDERNESS</b> <span class="blk">plate</span><div class="c">a vast uninhabited Sinai desert waste under a wide barren sky: rolling stony dunes and cracked sunbleached ground stretching to distant lifeless hills, scattered thornscrub, a thin haze of dust on the wind, no shelter and no water, the desolate land into which the scapegoat is driven</div></figcaption></figure><figure><img src="places/WILDERNESS_CAMP.png" loading="lazy"><figcaption><b>WILDERNESS_CAMP</b> <span class="blk">plate</span><div class="c">an ancient Israelite wilderness encampment at dusk in the rocky Sinai desert: scattered rough goat-hair tents, low firelight, bare rocky sand, distant barren hills under a heavy dim sky</div></figcaption></figure></div><h2>MOTIF <span class="muted">(54)</span></h2><div class="grid"><figure><img src="motifs/ARM_OF_THE_LORD.png" loading="lazy"><figcaption><b>ARM_OF_THE_LORD</b> <span class="blk">motif</span><div class="c">a mighty shaft of bared divine power and radiant light breaking down out of parted heaven — the saving strength of the LORD made bare for a broken people (Isa 53:1), shown as glory and light, NOT a literal human arm or limb</div></figcaption></figure><figure><img src="motifs/BLOOD_MARKED_DOOR.png" loading="lazy"><figcaption><b>BLOOD_MARKED_DOOR</b> <span class="blk">motif</span><div class="c">a humble Israelite doorway in the night, its wooden lintel and two side posts struck with applied lamb&#x27;s blood, the marked house glowing safe while the shadow of judgment passes by unharming</div></figcaption></figure><figure><img src="motifs/BROTHERS_BOWING.png" loading="lazy"><figcaption><b>BROTHERS_BOWING</b> <span class="blk">motif</span><div class="c">the brothers kneeling low with faces to the ground before the robed Egyptian ruler they do not recognize as their own, the long-ago dream of bowing sheaves quietly fulfilled</div></figcaption></figure><figure><img src="motifs/BRUISED_HEEL_CRUSHED_HEAD.png" loading="lazy"><figcaption><b>BRUISED_HEEL_CRUSHED_HEAD</b> <span class="blk">motif</span><div class="c">the dual wound motif at the dust of the ground, the serpent striking and bruising the heel of the promised seed while that same heel crushes the serpent&#x27;s head beneath it</div></figcaption></figure><figure><img src="motifs/COSTLY_REDEMPTION.png" loading="lazy"><figcaption><b>COSTLY_REDEMPTION</b> <span class="blk">motif</span><div class="c">the kinsman-redeemer at the city gate spending his own wealth to redeem both the dead man land and his widow, to raise up the name of the dead upon his inheritance (Ruth 4:5-10), at real cost to himself</div></figcaption></figure><figure><img src="motifs/DARKENED_SKY.png" loading="lazy"><figcaption><b>DARKENED_SKY</b> <span class="blk">motif</span><div class="c">an unnatural midday darkness blanketing the whole land from the sixth hour to the ninth hour, the sun blotted out and the hills swallowed in an eerie supernatural gloom</div></figcaption></figure><figure><img src="motifs/DEATH_PASSING_OVER.png" loading="lazy"><figcaption><b>DEATH_PASSING_OVER</b> <span class="blk">motif</span><div class="c">the dark shadow of the destroyer moving silently down a night street of Egypt, halting at and passing over a single blood-marked doorway that stands untouched in the gloom</div></figcaption></figure><figure><img src="motifs/DREAM_SHEAVES_STARS.png" loading="lazy"><figcaption><b>DREAM_SHEAVES_STARS</b> <span class="blk">motif</span><div class="c">Joseph&#x27;s two separate dreams: eleven sheaves of grain bowing low to one upright sheaf, and the sun, moon and eleven stars bending in homage above</div></figcaption></figure><figure><img src="motifs/EMPTY_TOMB.png" loading="lazy"><figcaption><b>EMPTY_TOMB</b> <span class="blk">motif</span><div class="c">the open mouth of a rock-hewn garden tomb at dawn, the great round sealing stone rolled fully aside, the linen grave-clothes lying empty on the cold stone shelf with the napkin folded apart by itself (John 20:6-7), a shaft of soft golden resurrection light falling into the vacant chamber</div></figcaption></figure><figure><img src="motifs/FACES_OF_DEAD_PROPHETS.png" loading="lazy"><figcaption><b>FACES_OF_DEAD_PROPHETS</b> <span class="blk">motif</span><div class="c">shadowy translucent portraits of John the Baptist, Elias and Jeremias rising faintly from the dim past, the prophets of old the people guessed Christ to be (John beheaded, Elijah taken up alive, Jeremiah long dead)</div></figcaption></figure><figure><img src="motifs/FORGIVING_EMBRACE.png" loading="lazy"><figcaption><b>FORGIVING_EMBRACE</b> <span class="blk">motif</span><div class="c">the betrayed brother holding out bread instead of a sword, weeping openly as he gathers his guilty betrayers into a forgiving embrace rather than the vengeance he could take</div></figcaption></figure><figure><img src="motifs/GLASSY_STILL_SEA.png" loading="lazy"><figcaption><b>GLASSY_STILL_SEA</b> <span class="blk">motif</span><div class="c">a wide open SEA stilled flat to a mirror-smooth sheet of water stretching to the far horizon under a clearing sky, one small wooden fishing boat resting motionless upon the glassy water at Christ&#x27;s word — real open sea to the horizon, NOT a tiled floor, NOT an indoor glass floor, NOT dry land</div></figcaption></figure><figure><img src="motifs/GRAVE.png" loading="lazy"><figcaption><b>GRAVE</b> <span class="blk">motif</span><div class="c">a dark rock-cut sepulchre and its sealing stone in shadow, the grave that the wilderness manna could never keep its eaters from, now broken open and defeated by the true Bread</div></figcaption></figure><figure><img src="motifs/INIQUITY_LAID_ON_HIM.png" loading="lazy"><figcaption><b>INIQUITY_LAID_ON_HIM</b> <span class="blk">motif</span><div class="c">scattered straying sheep wandering above, and below them one bowed innocent Servant bearing a heavy dark burden settling down upon his shoulders alone — the guilt of us all laid on him</div></figcaption></figure><figure><img src="motifs/LAYING_ON_OF_HANDS.png" loading="lazy"><figcaption><b>LAYING_ON_OF_HANDS</b> <span class="blk">motif</span><div class="c">the fully-robed high priest in the tabernacle court pressing both of his hands down firmly upon the head of a standing live goat, the solemn transfer of confessed guilt onto the animal — reverent and modest, everyone fully clothed in priestly robes, NO nudity, nothing suggestive, no bare bodies</div></figcaption></figure><figure><img src="motifs/LIFTED_UP_CURSE.png" loading="lazy"><figcaption><b>LIFTED_UP_CURSE</b> <span class="blk">motif</span><div class="c">A single serpent figure cast in polished golden-bronze metal, bright warm bronze colour, raised upright on a small bronze collar at the very top of a tall straight bare wooden pole. The serpent body rises in one upright S-curve, head lifted. Plain atmospheric wilderness sky behind, reverent.</div></figcaption></figure><figure><img src="motifs/LIFTED_UP_GAZE.png" loading="lazy"><figcaption><b>LIFTED_UP_GAZE</b> <span class="blk">motif</span><div class="c">dying snake-bitten eyes in the wilderness dust turning and lifting upward toward a single cast-bronze serpent SET UPON THE VERY TOP of a tall straight BARE wooden pole, its bronze body and head lifted high like a banner; the long lower shaft is plain bare wood and the serpent does NOT coil, spiral, wind or wrap around the pole — NOT a snake-wound staff, NOT a caduceus or Rod of Asclepius, NOT a spear-tip or flag/banner-topped standard, the single upward gaze of faith by which the bitten live</div></figcaption></figure><figure><img src="motifs/LIGHT_FROM_HEAVEN.png" loading="lazy"><figcaption><b>LIGHT_FROM_HEAVEN</b> <span class="blk">motif</span><div class="c">a later radiance breaking down from the opened sky upon the old world, a light of grace falling that Noah in his own day never lived to see</div></figcaption></figure><figure><img src="motifs/LIGHT_OF_THE_WORLD.png" loading="lazy"><figcaption><b>LIGHT_OF_THE_WORLD</b> <span class="blk">motif</span><div class="c">Christ standing wrapped in a radiant warm divine light that pushes back the surrounding dark, the living light of life shining from his person into the world</div></figcaption></figure><figure><img src="motifs/LOOK_AND_LIVE.png" loading="lazy"><figcaption><b>LOOK_AND_LIVE</b> <span class="blk">motif</span><div class="c">a snake-bitten man fallen in the wilderness dust lifting his dying eyes up toward a single cast-bronze serpent SET UPON THE VERY TOP of a tall straight BARE wooden pole, its bronze body and head lifted high like a banner; the long lower shaft is plain bare wood and the serpent does NOT coil, spiral, wind or wrap around the pole — NOT a snake-wound staff, NOT a caduceus or Rod of Asclepius, NOT a spear-tip or flag/banner-topped standard, healed the instant he looks up in faith</div></figcaption></figure><figure><img src="motifs/MAN_CAST_INTO_SEA.png" loading="lazy"><figcaption><b>MAN_CAST_INTO_SEA</b> <span class="blk">motif</span><div class="c">a lone robed figure hurled from the heaving deck of a wooden ship into the dark swallowing waves, his body sinking into the churning waters, while above and around him the violent storm falls suddenly still and the rest are spared</div></figcaption></figure><figure><img src="motifs/MERCY_TOO_WIDE.png" loading="lazy"><figcaption><b>MERCY_TOO_WIDE</b> <span class="blk">motif</span><div class="c">the reach of God&#x27;s grace stretching impossibly wide: a vast beam of warm light pouring down from a great walled city high above all the way to a single lone figure sunk deep at the very bottom of the sea, grace reaching wider and lower than either deserves</div></figcaption></figure><figure><img src="motifs/NEHUSHTAN_BROKEN.png" loading="lazy"><figcaption><b>NEHUSHTAN_BROKEN</b> <span class="blk">motif</span><div class="c">the once-healing bronze serpent, long since turned into an idol, smashed to broken pieces by the hand of the good king of Judah as worshippers look on</div></figcaption></figure><figure><img src="motifs/OPEN_DOOR.png" loading="lazy"><figcaption><b>OPEN_DOOR</b> <span class="blk">motif</span><div class="c">a single open doorway standing alone, light pouring out from within across the threshold, never barred or locked, the one waiting way of entrance for whoever comes</div></figcaption></figure><figure><img src="motifs/OUTSIDER_BROUGHT_IN.png" loading="lazy"><figcaption><b>OUTSIDER_BROUGHT_IN</b> <span class="blk">motif</span><div class="c">the foreign Moabite woman, once a stranger outside the covenant, led in and grafted into the line of Israel and brought all the way home as a welcomed bride</div></figcaption></figure><figure><img src="motifs/OUTSTRETCHED_PIERCED_HANDS.png" loading="lazy"><figcaption><b>OUTSTRETCHED_PIERCED_HANDS</b> <span class="blk">motif</span><div class="c">Risen Christ, both arms stretched wide forward in welcome, palms turned outward and open. Each open palm bears one small round dark healed scar at its centre, old skin closed flat and level with the surface of the palm. Fingers smooth and unmarked, ordinary natural skin tone, plain even daylight, calm and reverent.</div></figcaption></figure><figure><img src="motifs/PIERCED_HANDS_AND_FEET.png" loading="lazy"><figcaption><b>PIERCED_HANDS_AND_FEET</b> <span class="blk">motif</span><div class="c">The risen Christ&#x27;s two open hands and two bare feet together in solemn dim light. Each open palm bears one small round dark healed scar at its centre, skin closed flat and level. Each bare foot bears one small round dark healed scar on the instep, skin closed flat and level. Smooth whole skin around every scar, calm and reverent.</div></figcaption></figure><figure><img src="motifs/PILLAR_OF_FIRE.png" loading="lazy"><figcaption><b>PILLAR_OF_FIRE</b> <span class="blk">motif</span><div class="c">a towering column of living divine fire rising into the night sky over the desert camp, casting warm wavering light across the sand and the tents of Israel, the visible presence of God leading His people through the dark</div></figcaption></figure><figure><img src="motifs/POINTING_HAND_OF_GOD.png" loading="lazy"><figcaption><b>POINTING_HAND_OF_GOD</b> <span class="blk">motif</span><div class="c">a single shaft of heavenly light breaking down through cloud onto an upturned face, the unseen revealing touch of God opening blind eyes to the truth from above</div></figcaption></figure><figure><img src="motifs/PROVIDED_LAMB.png" loading="lazy"><figcaption><b>PROVIDED_LAMB</b> <span class="blk">motif</span><div class="c">the lamb that God Himself would provide for the offering, longed for and unseen on the height of Moriah, the promise left open until it is found at last in Christ</div></figcaption></figure><figure><img src="motifs/RAISED_TO_RIGHT_HAND.png" loading="lazy"><figcaption><b>RAISED_TO_RIGHT_HAND</b> <span class="blk">motif</span><div class="c">the humbled Servant lifted up out of the pit below and exalted high into radiant glory, raised to the place of highest honor at the right hand of power; the divine presence shown ONLY as a high warm radiance above — NO face, NO body, NO throne-figure, NO human form of God depicted</div></figcaption></figure><figure><img src="motifs/REDEEMER_AND_BRIDE.png" loading="lazy"><figcaption><b>REDEEMER_AND_BRIDE</b> <span class="blk">motif</span><div class="c">the kinsman-redeemer taking the poor foreign widow by the hand and leading her home as his own bride, the lowly outsider lifted into covenant love</div></figcaption></figure><figure><img src="motifs/REFUGE_THROUGH_JUDGMENT.png" loading="lazy"><figcaption><b>REFUGE_THROUGH_JUDGMENT</b> <span class="blk">motif</span><div class="c">the great wooden ark riding high and unharmed above the drowning floodwaters, bearing all those sealed inside safely through the very judgment that destroys the world</div></figcaption></figure><figure><img src="motifs/RENT_VEIL.png" loading="lazy"><figcaption><b>RENT_VEIL</b> <span class="blk">motif</span><div class="c">the heavy embroidered temple veil torn in twain from the top to the bottom, the way into the holy place thrown open from above, the severed threads hanging loose at the great tear</div></figcaption></figure><figure><img src="motifs/SACRIFICIAL_LAMB.png" loading="lazy"><figcaption><b>SACRIFICIAL_LAMB</b> <span class="blk">motif</span><div class="c">a silent white lamb led unresisting to the slaughter, dumb before its shearers, head lowered in quiet submission as it goes to be offered up</div></figcaption></figure><figure><img src="motifs/SCAPEGOAT_DEPARTING.png" loading="lazy"><figcaption><b>SCAPEGOAT_DEPARTING</b> <span class="blk">motif</span><div class="c">a lone goat growing smaller as it wanders away into the vast empty wilderness under a wide sky, carrying the people&#x27;s confessed sin out and away, never to return</div></figcaption></figure><figure><img src="motifs/SEATED_PRIEST.png" loading="lazy"><figcaption><b>SEATED_PRIEST</b> <span class="blk">motif</span><div class="c">Christ our great High Priest, His atoning work finished, seated down in rest at the right hand of God — the seated posture (unlike the Levitical priests who stood daily, never sitting) declaring the offering finished forever</div></figcaption></figure><figure><img src="motifs/SERPENT_LIFTED_HIGH.png" loading="lazy"><figcaption><b>SERPENT_LIFTED_HIGH</b> <span class="blk">motif</span><div class="c">A single serpent figure cast in polished golden-bronze metal, bright warm bronze colour, raised upright and standing free on a small bronze collar at the very top end of a tall straight bare wooden pole, lifted high above the desert. The serpent body rises in one upright S-curve held clear above the pole, head lifted; it sits atop the pole and is not wound or coiled around it. Plain atmospheric wilderness sky behind, reverent.</div></figcaption></figure><figure><img src="motifs/SHEEP_GONE_ASTRAY.png" loading="lazy"><figcaption><b>SHEEP_GONE_ASTRAY</b> <span class="blk">motif</span><div class="c">scattered sheep wandering off in every direction across the bare hills, each one turned to its own way, straying farther and farther from the fold</div></figcaption></figure><figure><img src="motifs/SHEPHERD_AS_DOOR.png" loading="lazy"><figcaption><b>SHEPHERD_AS_DOOR</b> <span class="blk">motif</span><div class="c">A shepherd seated upright in the open gateway gap of a round stone-walled sheepfold, his own body filling the entrance and blocking the only way in, shepherd&#x27;s staff across his knees, calm watchful face. Behind him inside the fold a flock of sheep resting safely. Beyond, an open dusk hillside. He himself is the living door of the fold. Warm low light, reverent.</div></figcaption></figure><figure><img src="motifs/SHUT_IN_BY_GOD.png" loading="lazy"><figcaption><b>SHUT_IN_BY_GOD</b> <span class="blk">motif</span><div class="c">the great pitch-sealed ark door drawn shut and sealed fast as if by unseen power from outside, the shutting-in that Noah never performed (the LORD shut him in, Gen 7:16) — shown by light and providence, NO human hand or figure of God</div></figcaption></figure><figure><img src="motifs/SON_CARRYING_WOOD.png" loading="lazy"><figcaption><b>SON_CARRYING_WOOD</b> <span class="blk">motif</span><div class="c">the beloved son climbing the hill of Moriah with the heavy bundle of wood for his own offering bound across his shoulders, bearing up the very wood of his sacrifice</div></figcaption></figure><figure><img src="motifs/SOUL_HUNGER.png" loading="lazy"><figcaption><b>SOUL_HUNGER</b> <span class="blk">motif</span><div class="c">a lone figure seated amid heaps of plenty and food yet hollow-eyed and empty, an aching inner soul-hunger that no earthly bread or possession can ever fill — reverent, fully clothed</div></figcaption></figure><figure><img src="motifs/STAYED_HAND.png" loading="lazy"><figcaption><b>STAYED_HAND</b> <span class="blk">motif</span><div class="c">Aged Abraham, grey-bearded in a simple robe, kneeling alone on a rocky summit, his face and one open empty hand lifted high toward a radiant break of holy light above, overcome with relief and awe. Close before him a single ram is caught fast by its curled horns in a low thicket of dry branches. The moment the LORD provided the ram as the substitute. Rocky Moriah summit, plain wilderness, reverent, no other figures.</div></figcaption></figure><figure><img src="motifs/STIRRING_WATER.png" loading="lazy"><figcaption><b>STIRRING_WATER</b> <span class="blk">motif</span><div class="c">the troubled surface of a stone pool of Bethesda rippling and stirring, ringed by the waiting sick, the troubled water believed to heal the first to step in</div></figcaption></figure><figure><img src="motifs/STRIPES_AND_WOUNDS.png" loading="lazy"><figcaption><b>STRIPES_AND_WOUNDS</b> <span class="blk">motif</span><div class="c">The suffering Servant seen from behind, head bowed, his bare back heavily bruised all over from scourging. The skin is smooth, continuous and unbroken, darkly discoloured in large soft blotches of deep red and deep purple, swollen and tender, with a few faint smears of dried blood. Only deep bruising and discolouration on whole even skin. Plain bare shoulders and arms. Dim temple-courtyard light behind. Reverent and modest.</div></figcaption></figure><figure><img src="motifs/SUBSTITUTION.png" loading="lazy"><figcaption><b>SUBSTITUTION</b> <span class="blk">motif</span><div class="c">the caught ram led to the altar to die in the very place of the spared son, the swapped victim taking the bound one&#x27;s place upon the wood</div></figcaption></figure><figure><img src="motifs/SUFFERING_SERVANT.png" loading="lazy"><figcaption><b>SUFFERING_SERVANT</b> <span class="blk">motif</span><div class="c">the marred Man of sorrows standing despised and rejected, no form or beauty in him, his face worn with grief and his body wounded for the transgressions of others</div></figcaption></figure><figure><img src="motifs/THE_VISION.png" loading="lazy"><figcaption><b>THE_VISION</b> <span class="blk">motif</span><div class="c">the prophet beholding a far-off prophetic vision of the suffering and execution of the Servant, the whole scene seen clearly seven hundred years before it came to pass</div></figcaption></figure><figure><img src="motifs/THREE_DAYS_DARKNESS.png" loading="lazy"><figcaption><b>THREE_DAYS_DARKNESS</b> <span class="blk">motif</span><div class="c">the deep enclosing dark of three days and three nights buried away in the heart of the earth, the lightless interval before the appointed return to life</div></figcaption></figure><figure><img src="motifs/THREE_DAYS_DEEP.png" loading="lazy"><figcaption><b>THREE_DAYS_DEEP</b> <span class="blk">motif</span><div class="c">three days and three nights buried alive in the swallowing dark of the deep, then given back living to the light, the prophet&#x27;s ordeal standing as the sign of resurrection</div></figcaption></figure><figure><img src="motifs/TWO_LOTS.png" loading="lazy"><figcaption><b>TWO_LOTS</b> <span class="blk">motif</span><div class="c">the high priest casting lots over the two goats standing side by side at the ancient tabernacle door, holding two small blank unmarked lot-stones, one cast toward the goat on the left and one toward the goat on the right, their fates divided; an ancient Hebrew tabernacle setting, NO cross of any kind</div></figcaption></figure><figure><img src="motifs/UNBROKEN_BONE.png" loading="lazy"><figcaption><b>UNBROKEN_BONE</b> <span class="blk">motif</span><div class="c">the roasted Passover lamb held whole and entire, not one of its bones broken, the strict command honored that finds its fulfillment in Christ&#x27;s own unbroken legs</div></figcaption></figure><figure><img src="motifs/WOUNDS_BORNE.png" loading="lazy"><figcaption><b>WOUNDS_BORNE</b> <span class="blk">motif</span><div class="c">The suffering Servant standing with head bowed, bare torso. Skin mottled with dark purple-brown bruises and many thin reddish stripe-marks across the chest, shoulders and arms. Dull matte skin in heavy shadow. Solemn reverent low light, the weight of substitution carried in silence.</div></figcaption></figure></div>
