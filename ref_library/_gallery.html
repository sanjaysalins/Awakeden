<h1>Awakeden Base-Elements — rendered references <span class="muted">(245)</span></h1>
<h2>CHARACTER <span class="muted">(76)</span></h2><div class="grid"><figure><img src="characters/AARON.png" loading="lazy"><figcaption><b>AARON</b> <span class="blk">charsheet</span><div class="c">Aaron, Israel&#x27;s first high priest, a slender slightly stooped Hebrew elder of about eighty, weathered light-olive skin and thin blue-veined hands, a solemn narrow dignified face, long flowing snow-white hair and a full white beard; on the Day of Atonement stripped of all his gold to a plain undyed white linen tunic and linen sash, barefoot, a plain white linen mitre bound on his head, lifting a smoking golden censer in both reverent hands</div></figcaption></figure><figure><img src="characters/ABRAHAM.png" loading="lazy"><figcaption><b>ABRAHAM</b> <span class="blk">charsheet</span><div class="c">Abraham the patriarch, a very old Hebrew nomad well past a hundred years, tall and gaunt with deeply weathered sun-blackened bronze skin and hollow cheeks, a grave heavy-hearted lined face and sorrowful resolute eyes, long flowing white hair and a thin wind-blown white beard, robed in a dust-grey striped Chaldean desert mantle and a head-cloth bound with dark cord, a curved flint knife at his rope girdle</div></figcaption></figure><figure><img src="characters/ADAM.png" loading="lazy"><figcaption><b>ADAM</b> <span class="blk">charsheet</span><div class="c">Adam, the first man, a strong athletic young figure with warm sun-bronzed skin, tousled dark-brown hair and a short dark beard, a noble face now stricken with shame and eyes cast down, his bare muscular body covered only by a rough girdle of sewn green fig leaves about his loins, crouching half-hidden among the lush trees of Eden</div></figcaption></figure><figure><img src="characters/ADULTEROUS_WOMAN.png" loading="lazy"><figcaption><b>ADULTEROUS_WOMAN</b> <span class="blk">charsheet</span><div class="c">the woman taken in adultery, a young ancient Judean woman of about twenty with smooth olive skin and long loose dishevelled black hair falling across her face, a tear-streaked cheek and head bowed low in shame, her plain dust-brown robe disordered and slipping from one bare shoulder, kneeling alone and trembling on the dusty temple stone</div></figcaption></figure><figure><img src="characters/ANDREW.png" loading="lazy"><figcaption><b>ANDREW</b> <span class="blk">charsheet</span><div class="c">Andrew the apostle, Simon Peter&#x27;s brother and a lifelong Galilean fisherman of about forty-five, deeply sun-bronzed weather-cracked olive skin, a broad open friendly face creased by squinting at the sea, thick salt-and-pepper wavy hair worn loose to the jaw and a full untrimmed grizzled grey-brown beard, a coil of fishing net slung over one shoulder, dressed in a coarse undyed cream fisherman&#x27;s tunic kilted up at the knees with a wide rope girdle, bare weathered forearms and net-callused hands</div></figcaption></figure><figure><img src="characters/ANGEL_OF_THE_LORD.png" loading="lazy"><figcaption><b>ANGEL_OF_THE_LORD</b> <span class="blk">charsheet</span><div class="c">the Angel of the LORD, a radiant towering CREATED heavenly messenger of awesome presence and NO wings (a sent angel, NOT a depiction of God Himself — theophany/identity-as-God scenes use glory-light instead), a luminous beardless youthful face framed by light-touched flowing hair, robed in shining white-and-gold raiment, brilliant radiance pouring around him from a torn-open sky</div></figcaption></figure><figure><img src="characters/BARTHOLOMEW.png" loading="lazy"><figcaption><b>BARTHOLOMEW</b> <span class="blk">charsheet</span><div class="c">Bartholomew, also called Nathanael, the guileless true Israelite &#x27;in whom is no guile&#x27;, a wiry man of about thirty-five with warm mid-olive skin, a candid honest open face with clear steady frank eyes and an easy half-smile, dark brown curling hair to the nape and a moderate softly-curled chestnut beard, dressed in a striped cream-and-brown woven mantle over a plain undyed tunic with a folded head-cloth resting on his shoulders, hands open and unguarded</div></figcaption></figure><figure><img src="characters/BOAZ.png" loading="lazy"><figcaption><b>BOAZ</b> <span class="blk">charsheet</span><div class="c">Boaz, a mighty man of wealth of Bethlehem, a broad-shouldered prosperous Hebrew landowner of about fifty, sun-bronzed olive skin, a strong kind weather-creased face, dark hair greying at the temples and a full square trimmed beard, wearing a fine wheat-gold layered robe with a wide woven girdle and a russet head-cloth, ears of barley and threshing-floor dust about him, the easy bearing of a generous kinsman-redeemer</div></figcaption></figure><figure><img src="characters/CITY_ELDERS.png" loading="lazy"><figcaption><b>CITY_ELDERS</b> <span class="blk">group</span><div class="c">the ten elders of Bethlehem called as witnesses at the city gate, aged Hebrew townsmen of varied years, weathered olive skin and long grey and white beards, robed in plain layered mantles of muted brown and grey with simple head-cloths, standing gravely shoulder to shoulder to seal the redemption</div></figcaption></figure><figure><img src="characters/CROWD.png" loading="lazy"><figcaption><b>CROWD</b> <span class="blk">group</span><div class="c">a crowd of ancient Judean onlookers, common first-century men and women of mixed ages, olive-skinned weathered faces, bearded men and veiled women, dressed in plain undyed tunics, mantles and headcloths in browns and creams, pressing together and murmuring</div></figcaption></figure><figure><img src="characters/DISCIPLES.png" loading="lazy"><figcaption><b>DISCIPLES</b> <span class="blk">group</span><div class="c">the twelve disciples, first-century Galilean Jewish men of mixed ages, weathered olive-skinned faces, dark beards and hair, several rugged fishermen among them, dressed in simple coarse homespun tunics and mantles with rope girdles and leather sandals</div></figcaption></figure><figure><img src="characters/DYING_CAMP.png" loading="lazy"><figcaption><b>DYING_CAMP</b> <span class="blk">charsheet</span><div class="c">the snakebitten Israelite camp in the wilderness, a sprawl of dusty goat-hair tents and stricken Hebrew wanderers in coarse earth-toned robes, gaunt fevered faces and writhing fallen bodies clutching swollen serpent-bitten limbs, the dying and grieving strewn across the cracked desert ground under a harsh sky</div></figcaption></figure><figure><img src="characters/EGYPTIANS.png" loading="lazy"><figcaption><b>EGYPTIANS</b> <span class="blk">group</span><div class="c">a group of ancient Egyptian nobles and citizens standing in a row in a lamplit Egyptian hall, bronze skin, formal striped headdresses and broad collars, in fine long pleated white linen robes, dignified, modest and fully clothed</div></figcaption></figure><figure><img src="characters/ETHIOPIAN_EUNUCH.png" loading="lazy"><figcaption><b>ETHIOPIAN_EUNUCH</b> <span class="blk">charsheet</span><div class="c">the Ethiopian eunuch, a dignified African court official of Candace&#x27;s treasury, deep dark-brown skin, a smooth full-cheeked clean-shaven noble face, richly dressed in fine layered robes of saffron and indigo and a jewelled gold headdress, seated upright in an ornate chariot holding an unrolled prophet&#x27;s scroll covered only in faint vague illegible ancient script</div></figcaption></figure><figure><img src="characters/EVE.png" loading="lazy"><figcaption><b>EVE</b> <span class="blk">charsheet</span><div class="c">Eve, the first woman, a graceful slender young figure with warm golden-brown skin and long flowing chestnut-dark hair falling about her shoulders, a fair sorrowful face turned away in shame, her bare body covered only by a soft girdle of sewn fig leaves, crouching close beside Adam amid the verdant trees of Eden</div></figcaption></figure><figure><img src="characters/FIRSTBORN_SON.png" loading="lazy"><figcaption><b>FIRSTBORN_SON</b> <span class="blk">charsheet</span><div class="c">the firstborn son of a Hebrew household, a young boy of about ten, smooth olive skin, dark tousled hair, a calm gentle face, dressed in a simple coarse cream tunic, standing safe and well within the lamplit inner room of his home</div></figcaption></figure><figure><img src="characters/FIT_MAN.png" loading="lazy"><figcaption><b>FIT_MAN</b> <span class="blk">charsheet</span><div class="c">the fit man appointed to lead away the live goat, a wiry sinewy ancient Hebrew man of middle age, deeply sun-burnt leathery brown skin, a plain short black beard and close-cropped hair bound under a coarse head-cloth, dressed in a dust-ochre coarse tunic with a rope girdle, gripping the cord of the scapegoat in a calloused fist as he strides into the wilderness</div></figcaption></figure><figure><img src="characters/HEZEKIAH.png" loading="lazy"><figcaption><b>HEZEKIAH</b> <span class="blk">charsheet</span><div class="c">Hezekiah, the godly king of Judah, a dignified Hebrew man of middle years with olive skin and a well-kept dark beard, resolute righteous eyes, wearing a richly dyed blue-and-crimson royal robe with an embroidered hem and a simple gold circlet, a calm upright kingly bearing with his hands at his sides</div></figcaption></figure><figure><img src="characters/ISAAC.png" loading="lazy"><figcaption><b>ISAAC</b> <span class="blk">charsheet</span><div class="c">Isaac, Abraham&#x27;s beloved son of promise, a strong gentle young Hebrew man, smooth sun-warmed olive skin, a trusting open face, dark hair and a soft young first beard, in a simple undyed tunic, a heavy bundle of split wood bound on his back as he climbs the mountain</div></figcaption></figure><figure><img src="characters/ISAIAH.png" loading="lazy"><figcaption><b>ISAIAH</b> <span class="blk">charsheet</span><div class="c">Isaiah the prophet, son of Amoz, an aged Hebrew seer of Judah of about sixty, weathered olive skin, a grave lean lined face, long iron-grey hair and a full grey beard, intent reverent eyes and ink-stained fingers, robed in a coarse undyed sackcloth-brown prophet&#x27;s mantle and head-cloth, bent over an unrolled scroll writing the vision by hand with a reed pen</div></figcaption></figure><figure><img src="characters/ISHMAELITE_CARAVAN.png" loading="lazy"><figcaption><b>ISHMAELITE_CARAVAN</b> <span class="blk">group</span><div class="c">the Ishmaelite trading caravan bound for Egypt, a line of swarthy desert merchants with sun-darkened faces and dark beards, wrapped in striped flowing robes and head-cloths bound with cord, leading laden camels strung with bales of spicery, balm and myrrh across the shimmering desert sand</div></figcaption></figure><figure><img src="characters/ISRAEL_NATION.png" loading="lazy"><figcaption><b>ISRAEL_NATION</b> <span class="blk">group</span><div class="c">the whole nation of Israel at the Day of Atonement, a vast assembled throng of ancient Hebrews in earth-toned and undyed wool robes and head-coverings, hushed solemn faces of every age turned in breath-held expectation toward the tabernacle, the multitude stretching back across the desert encampment</div></figcaption></figure><figure><img src="characters/ISRAELITE_CROWD.png" loading="lazy"><figcaption><b>ISRAELITE_CROWD</b> <span class="blk">group</span><div class="c">a large gathered crowd of ancient Israelite people, men and women in modest coarse desert robes, mantles and headcloths, dust-worn faces, standing together in the wilderness camp, dignified, modest and fully clothed</div></figcaption></figure><figure><img src="characters/ISRAELITE_HOUSEHOLD.png" loading="lazy"><figcaption><b>ISRAELITE_HOUSEHOLD</b> <span class="blk">group</span><div class="c">A household of ancient Hebrew folk standing together at the doorway of their stone house: bearded robed men, veiled women and grey elders side by side, all in modest coarse desert robes, mantles and headcloths over dust-worn olive skin, dignified, reverent and fully dressed, an ordinary warm day</div></figcaption></figure><figure><img src="characters/JACOB.png" loading="lazy"><figcaption><b>JACOB</b> <span class="blk">charsheet</span><div class="c">Jacob, called Israel, an aged Hebrew patriarch with weathered deeply-lined olive skin, a long flowing white beard and white hair, tender grieving deep-set eyes, wrapped in a layered patriarchal mantle of bold muted earthen stripes over a long robe, leaning heavily on a worn wooden staff and favouring his lamed thigh</div></figcaption></figure><figure><img src="characters/JAMES_SON_OF_ALPHAEUS.png" loading="lazy"><figcaption><b>JAMES_SON_OF_ALPHAEUS</b> <span class="blk">charsheet</span><div class="c">James the son of Alphaeus, called &#x27;James the less&#x27;, the youngest and smallest of the Twelve, a slight short-statured youth of about the early twenties with smooth fair-olive skin and a boyish earnest unlined face, sparse soft beginnings of a light-brown beard barely shadowing his jaw, short curly light-brown hair, dressed in a simple undyed homespun tunic and a plain pale-tan mantle a touch too large for his small frame, a quiet modest gaze</div></figcaption></figure><figure><img src="characters/JAMES_SON_OF_ZEBEDEE.png" loading="lazy"><figcaption><b>JAMES_SON_OF_ZEBEDEE</b> <span class="blk">charsheet</span><div class="c">James the son of Zebedee, John&#x27;s elder brother and a &#x27;son of thunder&#x27;, a powerfully built Galilean of about thirty-five, broad-shouldered and tall with sun-darkened ruddy-olive skin, a bold square-jawed commanding face with strong dark brows, thick jet-black hair pushed back and a full dense black beard, a firm resolute set to his mouth, dressed in a rust-red mantle over a coarse ochre tunic with a thick leather belt, one strong hand resting at his side. His eyes are ORDINARY natural dark-brown human eyes — NOT glowing, NOT luminous, NOT red, NOT orange, NOT yellow, NOT supernatural in any way; a normal calm human gaze</div></figcaption></figure><figure><img src="characters/JESUS.png" loading="lazy"><figcaption><b>JESUS</b> <span class="blk">charsheet</span><div class="c">Jesus of Nazareth, a Jewish man of about thirty, warm olive-brown skin, a calm noble face, long dark brown hair parted in the middle to the shoulders, a full dark brown beard, deep compassionate brown eyes; face + full standing body anchor grid (head about one-seventh of standing height)</div></figcaption></figure><figure><img src="characters/JOHN_THE_APOSTLE.png" loading="lazy"><figcaption><b>JOHN_THE_APOSTLE</b> <span class="blk">charsheet</span><div class="c">John the apostle, the youngest disciple, a Galilean fisherman of about thirty, smooth olive skin, a soft only-lightly-bearded gentle face, dark wavy shoulder-length hair, earnest tender eyes, in a simple homespun cream tunic and mantle — the beloved disciple who stood at the cross</div></figcaption></figure><figure><img src="characters/JOHN_THE_BAPTIST.png" loading="lazy"><figcaption><b>JOHN_THE_BAPTIST</b> <span class="blk">charsheet</span><div class="c">John the Baptist, a rugged wilderness prophet of about thirty, sun-darkened weathered olive skin, a fierce lean hungry face, long wild matted dark hair and an untrimmed shaggy dark beard, clothed in a rough camel&#x27;s-hair garment with a wide leather girdle about his loins, one sinewy arm outstretched pointing</div></figcaption></figure><figure><img src="characters/JONAH.png" loading="lazy"><figcaption><b>JONAH</b> <span class="blk">charsheet</span><div class="c">Jonah the prophet, son of Amittai, a Hebrew man of about fifty, weathered olive skin, a haggard storm-worn face, soaked dark hair and a dripping tangled beard, wide terrified eyes, robed in a sodden coarse tunic and mantle clinging wet, strands of sea-weed wrapped about him</div></figcaption></figure><figure><img src="characters/JOSEPH.png" loading="lazy"><figcaption><b>JOSEPH</b> <span class="blk">charsheet</span><div class="c">Joseph, son of Jacob, raised to governor of Egypt, a Hebrew man of about thirty-five, smooth olive-brown skin, a composed noble clean-shaven Egyptian-court face, dark hair under a fine headdress, robed in fine white linen with a broad gold collar and signet ring at Pharaoh&#x27;s right hand</div></figcaption></figure><figure><img src="characters/JOSEPHS_BROTHERS.png" loading="lazy"><figcaption><b>JOSEPHS_BROTHERS</b> <span class="blk">group</span><div class="c">the ten elder brothers of Joseph, weather-beaten Hebrew herdsmen of varied ages, sun-darkened olive skin, full dark and greying beards, dressed in dusty coarse travelling tunics, mantles and headcloths, bowing low with sacks for grain</div></figcaption></figure><figure><img src="characters/JUDAH.png" loading="lazy"><figcaption><b>JUDAH</b> <span class="blk">charsheet</span><div class="c">Judah, a rugged young Hebrew shepherd-son of about thirty, sun-bronzed skin and a thick dark beard, a strong-jawed weather-worn face with hard calculating eyes, wearing a coarse striped wool tunic girded with a leather belt and a rough goat-hair shoulder-cloak, a shepherd&#x27;s crook in his calloused hand</div></figcaption></figure><figure><img src="characters/JUDAS.png" loading="lazy"><figcaption><b>JUDAS</b> <span class="blk">charsheet</span><div class="c">Judas Iscariot, a first-century Jewish disciple of about thirty-five, a lean restless build, olive skin and a shadowed furtive narrow face, oiled dark hair and a thin pointed dark beard, dressed in a plain coarse tunic and mantle of muddy green, a small bulging bag of silver coins clutched white-knuckled in one hand</div></figcaption></figure><figure><img src="characters/KING_DAVID.png" loading="lazy"><figcaption><b>KING_DAVID</b> <span class="blk">charsheet</span><div class="c">David the shepherd-king of Israel, a younger Hebrew man of about thirty, ruddy sun-warmed olive skin, a strong handsome face, dark wavy hair and a short dark beard, a simple gold circlet and a royal robe over his tunic, cradling a wooden lyre or bent writing a scroll by lamplight</div></figcaption></figure><figure><img src="characters/LAME_MAN_OF_BETHESDA.png" loading="lazy"><figcaption><b>LAME_MAN_OF_BETHESDA</b> <span class="blk">charsheet</span><div class="c">the lame man of Bethesda, an emaciated invalid infirm thirty-eight years, gaunt sun-worn olive skin stretched over thin limbs, a haggard hollow-cheeked bearded face, sparse matted grey-streaked hair, dressed in a threadbare tattered tunic, lying helpless on a rough straw mat</div></figcaption></figure><figure><img src="characters/MARY.png" loading="lazy"><figcaption><b>MARY</b> <span class="blk">charsheet</span><div class="c">Mary, the young virgin mother, a gentle Hebrew maiden of about sixteen with smooth olive skin and dark hair veiled under a soft undyed earth-toned head-mantle, a serene humble face and downcast reverent eyes, dressed in a simple modest robe of muted homespun earth tones (NO Marian blue), her hands folded at her breast</div></figcaption></figure><figure><img src="characters/MATTHEW.png" loading="lazy"><figcaption><b>MATTHEW</b> <span class="blk">charsheet</span><div class="c">Matthew the apostle, the former tax-collector of Capernaum once prosperous and now plainly dressed, a man of about forty with smoother well-kept light-olive skin softer than the fishermen&#x27;s, a shrewd intelligent clean-lined face with alert watchful eyes, neatly groomed dark hair and a trimmed short dark beard, his once-fine garments now reduced to a simple muted blue-grey robe of good but worn cloth, a small reed pen and a folded writing-tablet tucked at his belt as a relic of his counting-table</div></figcaption></figure><figure><img src="characters/MOCKING_CROWD.png" loading="lazy"><figcaption><b>MOCKING_CROWD</b> <span class="blk">group</span><div class="c">a jeering ancient crowd, hard-faced first-century men of mixed ages, olive-skinned weathered features twisted in scorn, bearded mouths open in laughter, fingers pointed and heads wagging, dressed in plain dusty tunics, mantles and headcloths</div></figcaption></figure><figure><img src="characters/MOSES.png" loading="lazy"><figcaption><b>MOSES</b> <span class="blk">charsheet</span><div class="c">Moses, an aged Hebrew prophet and shepherd-leader of about eighty, weathered sun-darkened olive skin, a deeply lined broad noble face, long flowing grey hair and a full thick grey beard, deep-set wise weary eyes, wrapped in a rough heavy dark goat-hair desert mantle over a simple robe, gripping a tall plain wooden shepherd&#x27;s staff</div></figcaption></figure><figure><img src="characters/NAOMI.png" loading="lazy"><figcaption><b>NAOMI</b> <span class="blk">charsheet</span><div class="c">Naomi, an aged Hebrew widow with weathered olive skin and a deeply lined sorrowful face, grey hair bound beneath a worn dark mourning-veil, eyes hollowed with grief and bitterness, wrapped in a faded threadbare robe and shawl of muted grey-brown, her empty work-worn hands held open</div></figcaption></figure><figure><img src="characters/NEARER_KINSMAN.png" loading="lazy"><figcaption><b>NEARER_KINSMAN</b> <span class="blk">charsheet</span><div class="c">the nearer kinsman who refused to redeem, a stocky Hebrew townsman of Bethlehem of middle age, sun-worn olive skin, a guarded calculating bearded face with darting eyes, dark hair greying, robed in a drab grey-brown layered mantle and head-cloth, stooping to draw off his sandal as he turns evasively away</div></figcaption></figure><figure><img src="characters/NICODEMUS.png" loading="lazy"><figcaption><b>NICODEMUS</b> <span class="blk">charsheet</span><div class="c">Nicodemus, a Jewish ruler and Pharisee of about sixty, olive-skinned with a long full silver-grey beard and a lined scholarly face, deep cautious eyes, soft un-calloused hands, wearing a fringed dark blue-and-cream prayer mantle with tasseled tzitzit over a fine pale linen robe, a small clay oil lamp throwing warm light across his careworn features in the surrounding night</div></figcaption></figure><figure><img src="characters/NINEVITES.png" loading="lazy"><figcaption><b>NINEVITES</b> <span class="blk">group</span><div class="c">the people of Nineveh repenting, a great crowd of ancient Assyrians with bronze skin and long curled black beards, clad in sackcloth over rich layered Assyrian garments and tasseled robes, faces bowed in penitence, scattering dust and ashes upon their heads before the carved winged-bull gates of the great cruel city</div></figcaption></figure><figure><img src="characters/NOAH.png" loading="lazy"><figcaption><b>NOAH</b> <span class="blk">charsheet</span><div class="c">Noah, an exceedingly aged antediluvian patriarch of great years, weathered sun-browned skin deeply furrowed, a very long flowing white beard and long white hair, calm righteous deep-set eyes, broad work-hardened carpenter&#x27;s hands, clad in a coarse undyed woven tunic and rough goat-hair mantle, a wooden adze or mallet at his belt and pitch-stained forearms from building the ark</div></figcaption></figure><figure><img src="characters/NOAHS_HOUSEHOLD.png" loading="lazy"><figcaption><b>NOAHS_HOUSEHOLD</b> <span class="blk">group</span><div class="c">the eight souls of Noah&#x27;s household, aged Noah and his elderly wife with his three grown sons and their three young wives, an ancient Near-Eastern family of weathered olive skin and dark or greying hair, clad in coarse undyed and earth-toned woven robes and head-coverings, gathered close together as one family</div></figcaption></figure><figure><img src="characters/PASSOVER_FATHER.png" loading="lazy"><figcaption><b>PASSOVER_FATHER</b> <span class="blk">charsheet</span><div class="c">an archetypal Israelite father of a household on Passover night, a Hebrew man of about forty with weathered olive skin, a dark beard streaked grey, urgent solemn eyes, wearing a simple undyed wool tunic girded at the waist with a leather belt and a head-cloth, sandals on his feet and a staff in hand ready for travel, his hands and forearms marked with lamb&#x27;s blood from striking the doorposts of his mud-brick dwelling</div></figcaption></figure><figure><img src="characters/PAUL.png" loading="lazy"><figcaption><b>PAUL</b> <span class="blk">charsheet</span><div class="c">Paul of Tarsus, formerly Saul the Pharisee (the apostle to the Gentiles, NOT one of the Twelve), a short stocky strong-built man of about forty-five with light-olive skin, a high balding domed forehead with the hair receded to a fringe, a strong heavy prominent brow over piercing penetrating eyes, a long pointed greying dark-brown beard with natural human hair colour (never green or unnatural tints), a learned commanding intensity to his lined scholarly face, dressed in a plain dark-brown traveller&#x27;s mantle over an undyed tunic, gripping a rolled parchment scroll in one hand</div></figcaption></figure><figure><img src="characters/PETER.png" loading="lazy"><figcaption><b>PETER</b> <span class="blk">charsheet</span><div class="c">Peter the apostle, a robust weathered Galilean fisherman of about fifty, sun-darkened olive skin, a broad earnest face, thick greying dark hair and a full curly grey-flecked beard, strong calloused hands, wearing a coarse homespun tunic and mantle with a rope girdle</div></figcaption></figure><figure><img src="characters/PHARAOH.png" loading="lazy"><figcaption><b>PHARAOH</b> <span class="blk">charsheet</span><div class="c">Pharaoh, the king of Egypt, a regal clean-shaven man with smooth bronze skin and kohl-lined eyes, wearing the striped blue-and-gold nemes headcloth with a rearing golden uraeus cobra at the brow, a broad jewelled usekh collar of lapis and carnelian across his bare chest, a pleated white linen shendyt kilt and gold armlets, enthroned in regal Egyptian splendour holding a crook and flail</div></figcaption></figure><figure><img src="characters/PHILIP.png" loading="lazy"><figcaption><b>PHILIP</b> <span class="blk">charsheet</span><div class="c">Philip the evangelist, a lean travel-hardened first-century Jewish disciple of about forty, sun-warmed olive skin, an earnest open eager face, dark hair and a neatly trimmed dark beard, dressed in a simple coarse sand-coloured tunic and mantle with a leather satchel and worn sandals, striding the desert road beside the chariot</div></figcaption></figure><figure><img src="characters/PHILIP_THE_APOSTLE.png" loading="lazy"><figcaption><b>PHILIP_THE_APOSTLE</b> <span class="blk">charsheet</span><div class="c">Philip the apostle of Bethsaida (one of the Twelve, NOT Philip the evangelist), a thoughtful, questioning Galilean of about thirty, lean and of medium height with light-olive skin, a high-browed studious clean-featured face and searching narrowed eyes that seem mid-question, neatly combed short dark-brown hair and a short close-cropped brown beard, dressed in a plain olive-green tunic and a soft grey-brown mantle drawn over one shoulder, one hand lifted thoughtfully as if reasoning a point</div></figcaption></figure><figure><img src="characters/PILATE.png" loading="lazy"><figcaption><b>PILATE</b> <span class="blk">charsheet</span><div class="c">Pontius Pilate, the Roman governor of Judea, a clean-shaven Roman man of middle years with pale-bronze skin, a stern hawk-nosed patrician face and short cropped greying hair, wearing a plain undyed white Roman governor&#x27;s toga over a tunic (an equestrian prefect — NO senatorial purple stripe), an official ring on his hand, standing in cold imperial authority</div></figcaption></figure><figure><img src="characters/PRODIGAL_SON.png" loading="lazy"><figcaption><b>PRODIGAL_SON</b> <span class="blk">charsheet</span><div class="c">the prodigal son, a ragged barefoot young Hebrew man of about twenty, gaunt sunburnt olive skin, a hollow weary downcast face, matted dark hair and a scraggly young beard, dressed in filthy torn rags, head bowed as he trudges home</div></figcaption></figure><figure><img src="characters/ROMAN_SOLDIERS.png" loading="lazy"><figcaption><b>ROMAN_SOLDIERS</b> <span class="blk">group</span><div class="c">first-century Roman legionaries, hard sun-weathered men in segmented lorica armour over red tunics, crested or plain iron helmets, red cloaks, leather greaves and hobnailed sandals, bearing short swords, spears and shields, faces stern and impassive</div></figcaption></figure><figure><img src="characters/RUTH.png" loading="lazy"><figcaption><b>RUTH</b> <span class="blk">charsheet</span><div class="c">Ruth, a young Moabite widow of about twenty-five, sun-warmed olive skin and dark hair bound under a worn russet head-veil, gentle steadfast eyes in a weary lovely face, dressed in a patched and dusty coarse-woven robe of faded earthen tones girded for labour, bare forearms and dirt-stained hands clutching a gleaned sheaf of barley scraps in a humble field</div></figcaption></figure><figure><img src="characters/SAILORS.png" loading="lazy"><figcaption><b>SAILORS</b> <span class="blk">group</span><div class="c">the pagan mariners of the Joppa ship, a knot of weather-beaten ancient Near-Eastern seamen with sun-blackened skin, wild salt-matted hair and beards, fear-stricken faces, wearing rough kilted tunics and sashes soaked through, ropes and amulets at their belts, terrified hands flinging cargo overboard and casting lots on the heaving deck of a small wooden Phoenician sailing vessel</div></figcaption></figure><figure><img src="characters/SAMARITAN_WOMAN.png" loading="lazy"><figcaption><b>SAMARITAN_WOMAN</b> <span class="blk">charsheet</span><div class="c">the Samaritan woman at the well, an ancient Near-Eastern woman of middle years with sun-warmed olive skin and dark hair beneath a worn earth-toned head-veil, a weary careworn yet hopeful face, dressed in a plain dusty robe girded at the waist, balancing a rounded clay waterpot upon her shoulder</div></figcaption></figure><figure><img src="characters/SARAH.png" loading="lazy"><figcaption><b>SARAH</b> <span class="blk">charsheet</span><div class="c">Sarah, Abraham&#x27;s aged wife, an elderly Hebrew matriarch with finely wrinkled fair-olive skin and a gentle dignified face, silvered hair bound beneath a soft pale head-mantle, kind knowing eyes, wrapped in a flowing modest robe of warm cream and muted rose over undyed linen</div></figcaption></figure><figure><img src="characters/SCAPEGOAT.png" loading="lazy"><figcaption><b>SCAPEGOAT</b> <span class="blk">charsheet</span><div class="c">the live scapegoat of the Day of Atonement, a lone shaggy Near-Eastern male goat with rough tawny-and-white hair, curved horns and dark sorrowful eyes, driven solitary across a barren cracked-earth wilderness bearing the confessed iniquities into a land not inhabited</div></figcaption></figure><figure><img src="characters/SCRIBES_PHARISEES.png" loading="lazy"><figcaption><b>SCRIBES_PHARISEES</b> <span class="blk">group</span><div class="c">the scribes and Pharisees, robed first-century Jewish religious leaders of mixed older ages, olive-skinned dignified faces, greying dark beards, wearing fine layered robes, broad prayer-shawls with fringed tassels and phylacteries, severe and self-assured</div></figcaption></figure><figure><img src="characters/SEEKER_AT_THE_DOOR.png" loading="lazy"><figcaption><b>SEEKER_AT_THE_DOOR</b> <span class="blk">charsheet</span><div class="c">a seeker hesitating at the threshold, an ancient Near-Eastern figure of indeterminate middle years with olive skin and a downcast ashamed face, shoulders hunched and head lowered, wrapped in a plain travel-worn earth-toned robe and head-cloth, one hesitant hand half-raised at the dim open doorway of a stone dwelling</div></figcaption></figure><figure><img src="characters/SERPENT.png" loading="lazy"><figcaption><b>SERPENT</b> <span class="blk">object</span><div class="c">the cursed serpent of Eden, a great sinuous ancient snake with iridescent dark-green and bronze scales catching a cold gleam, a flat wedge-shaped head with slit cunning eyes and a flickering forked tongue, coiled low and beguiling among the shadowed roots and foliage of the garden</div></figcaption></figure><figure><img src="characters/SHEEP_FLOCK.png" loading="lazy"><figcaption><b>SHEEP_FLOCK</b> <span class="blk">group</span><div class="c">a flock of ancient Near-Eastern sheep and lambs, woolly fleeces in dusty cream and brown, gentle dark eyes and small horns on the rams, huddled and grazing together within a low rough stone fold</div></figcaption></figure><figure><img src="characters/SHEPHERD.png" loading="lazy"><figcaption><b>SHEPHERD</b> <span class="blk">charsheet</span><div class="c">an ancient Near-Eastern shepherd, a sturdy Hebrew herdsman of about forty with sun-darkened olive skin and a dark weather-worn beard, kind watchful eyes, wrapped in a rough undyed cream goat-hair cloak over a coarse brown girded tunic and a simple head-cloth, a worn leather sling at his belt, standing watchful among his flock with a tall crooked staff in hand</div></figcaption></figure><figure><img src="characters/SICK_MULTITUDE.png" loading="lazy"><figcaption><b>SICK_MULTITUDE</b> <span class="blk">group</span><div class="c">A great multitude of sick and infirm folk waiting along the edge of the pool of Bethesda. Ragged ancient Judean lame, halt and withered men and women with gaunt sun-worn weary faces, some lying on thin reed mats, some leaning on worn wooden crutches and walking-staves, some reaching feebly toward the water. Stone colonnade and still pool water behind, weary heavy light.</div></figcaption></figure><figure><img src="characters/SIMON_THE_ZEALOT.png" loading="lazy"><figcaption><b>SIMON_THE_ZEALOT</b> <span class="blk">charsheet</span><div class="c">Simon the Zealot, the former zealous freedom-fighter, a hard wiry intense man of about forty with deeply sun-blackened leathery olive skin and a fierce lean hawk-featured face, intense dark human eyes (normal eyes, NOT glowing, NOT red) under heavy black brows and a tightly clenched jaw, close-cropped black hair and a sharp forked black beard, a faded scar across one cheekbone, dressed in a dark olive-and-charcoal tunic with a worn leather baldric crossing his chest, a coiled intensity in his taut bearing</div></figcaption></figure><figure><img src="characters/SLAIN_GOAT.png" loading="lazy"><figcaption><b>SLAIN_GOAT</b> <span class="blk">charsheet</span><div class="c">the slain goat of the sin offering, a young Near-Eastern male goat with smooth dark-and-white hair and small horns, lying killed beside the bronze altar of the tabernacle, its lifeblood gathered into a bronze basin to be carried behind the veil, set against the smoke and gold of the tabernacle court</div></figcaption></figure><figure><img src="characters/SUBSTITUTE_RAM.png" loading="lazy"><figcaption><b>SUBSTITUTE_RAM</b> <span class="blk">charsheet</span><div class="c">the substitute ram of Moriah, a strong adult male ram with thick curling cream-and-tawny wool and great spiraling horns, dark patient eyes, caught fast by its horns in a dense thorny thicket upon the rocky mountain slope, struggling in Isaac&#x27;s place</div></figcaption></figure><figure><img src="characters/THADDAEUS.png" loading="lazy"><figcaption><b>THADDAEUS</b> <span class="blk">charsheet</span><div class="c">Thaddaeus, also called Judas the son of James, a gentle warm-natured apostle of about forty with soft sun-warmed olive skin and a kind round mild face, calm tender compassionate eyes and a gentle settled mouth, greying wavy brown hair thinning at the crown and a soft rounded grizzled grey-brown beard, dressed in a warm earthen ochre-brown tunic and a soft tan head-cloth bound simply across his brow, both hands resting peaceably at his breast</div></figcaption></figure><figure><img src="characters/THE_FATHER.png" loading="lazy"><figcaption><b>THE_FATHER</b> <span class="blk">charsheet</span><div class="c">the father of the prodigal, an aged Near-Eastern patriarch of about seventy, sun-darkened olive skin, a deeply lined dignified face, long flowing white hair and a full white beard, brimming tearful eyes, wearing a long fine layered robe of warm ochre and a head-cloth with the hem hiked up in his hand as he runs with both arms flung wide open</div></figcaption></figure><figure><img src="characters/THE_LORD.png" loading="lazy"><figcaption><b>THE_LORD</b> <span class="blk">glory</span><div class="c">the holy presence of the LORD shown ONLY as radiant divine light and glory breaking across the sky, never a human face, never a body, never a figure of any kind</div></figcaption></figure><figure><img src="characters/THOMAS.png" loading="lazy"><figcaption><b>THOMAS</b> <span class="blk">charsheet</span><div class="c">Thomas called Didymus the doubter, a tall lean Galilean of about thirty-five with sallow light-olive skin and a gaunt thoughtful face marked by a furrowed searching brow, restless sceptical deep-set grey eyes that seem to weigh and probe everything, dark hair receding slightly at the temples and a thin pointed dark beard, dressed in a sober slate-grey tunic and dark mantle, one hand half-raised with fingers as if reaching to verify by touch</div></figcaption></figure><figure><img src="characters/TWO_SERVANTS.png" loading="lazy"><figcaption><b>TWO_SERVANTS</b> <span class="blk">group</span><div class="c">the two young servants of Abraham left at the mountain&#x27;s foot, a pair of lean ancient Hebrew youths with sun-browned skin and short dark beards, clad in coarse undyed wool tunics girded with rope and simple head-cloths, waiting beside a tethered grey donkey on the barren rocky ground below</div></figcaption></figure><figure><img src="characters/WORSHIPPING_CONGREGATION.png" loading="lazy"><figcaption><b>WORSHIPPING_CONGREGATION</b> <span class="blk">group</span><div class="c">a great congregation of the nations turning to worship the LORD, a vast multitude of peoples of many ancient nations in varied earth-toned robes, head-coverings and mantles, faces of every kindred lifted in awe and reverence, hands raised together as the whole gathered throng bows toward the LORD</div></figcaption></figure></div><h2>OBJECT <span class="muted">(74)</span></h2><div class="grid"><figure><img src="objects/ALTAR.png" loading="lazy"><figcaption><b>ALTAR</b> <span class="blk">object</span><div class="c">a rough unhewn fieldstone altar built up by hand on a bare mountaintop, undressed rocks stacked square, split firewood laid in order across the top. A primitive patriarchal sacrifice-altar of natural stones — NOT a carved marble pagan altar, NOT a church communion table, NOT dressed masonry</div></figcaption></figure><figure><img src="objects/ANIMAL_PAIRS.png" loading="lazy"><figcaption><b>ANIMAL_PAIRS</b> <span class="blk">object</span><div class="c">living creatures going up into the ark in an orderly procession — clean beasts and fowls by sevens and the unclean by pairs (Gen 7:2-3), walking calmly side by side, NOT a chaotic single herd, NOT cartoon zoo animals</div></figcaption></figure><figure><img src="objects/ARK_DOOR.png" loading="lazy"><figcaption><b>ARK_DOOR</b> <span class="blk">object</span><div class="c">a close view of the ONE single great square door of Noah&#x27;s ark — the lone high doorway set in the long flat side of a colossal rectangular chest-like wooden ark built of pitch-blackened gopher-wood planks, shaped like an enormous flat-sided floating BOX with a long low pitched gable roof running its whole length and a SINGLE large square doorway set high in one long flat side — NOT a sailing ship, NOT a boat with a curved or pointed hull, NOT a shed, cabin or house, the single entrance shown standing open; no other door anywhere; NOT a covenant chest, NOT an ordinary house door</div></figcaption></figure><figure><img src="objects/ARK_OF_THE_COVENANT.png" loading="lazy"><figcaption><b>ARK_OF_THE_COVENANT</b> <span class="blk">object</span><div class="c">a gold-overlaid acacia-wood covenant chest with carrying-rings and poles, crowned by the golden mercy seat and two facing cherubim with wings outstretched above it. The sacred Ark of the Covenant — NOT Noah&#x27;s wooden barge-ship, NOT a plain treasure box; a gleaming gold cherubim-topped chest</div></figcaption></figure><figure><img src="objects/BINDING_KNIFE.png" loading="lazy"><figcaption><b>BINDING_KNIFE</b> <span class="blk">object</span><div class="c">an ancient sacrificial knife, a short bronze or flint blade with a worn wooden or bone handle, raised in a patriarch&#x27;s hand to slay the offering. The knife of the binding of Isaac — NOT a modern steel kitchen knife, NOT a sword or dagger; a primitive ritual slaughter-blade</div></figcaption></figure><figure><img src="objects/BLOOD.png" loading="lazy"><figcaption><b>BLOOD</b> <span class="blk">object</span><div class="c">fresh dark-red sacrificial blood pooled in a shallow vessel, glistening and thick, the atoning blood of the offering ready to be sprinkled or struck. Deep crimson lifeblood of a slain lamb or goat — NOT bright cartoon red, NOT wine, NOT a violent gory spatter</div></figcaption></figure><figure><img src="objects/BLOOD_BASIN.png" loading="lazy"><figcaption><b>BLOOD_BASIN</b> <span class="blk">object</span><div class="c">a shallow round ancient bason of hammered bronze or plain clay holding dark-red sacrificial blood, a hyssop branch resting beside it. A simple sacred catching-vessel — NOT a decorative bowl, NOT a modern dish, the blood real and dark not bright</div></figcaption></figure><figure><img src="objects/BLOOD_BEHIND_VEIL.png" loading="lazy"><figcaption><b>BLOOD_BEHIND_VEIL</b> <span class="blk">object</span><div class="c">dark sacrificial blood sprinkled upon the golden mercy seat within the Holy of Holies, fresh red drops glistening on the gleaming gold lid between the cherubim. The atoning blood brought inside the veil — NOT a basin of blood, NOT a smear on a doorpost; blood marked on the golden mercy seat</div></figcaption></figure><figure><img src="objects/BLOOD_ON_DOORPOST.png" loading="lazy"><figcaption><b>BLOOD_ON_DOORPOST</b> <span class="blk">object</span><div class="c">a humble Hebrew house doorway with fresh lamb&#x27;s blood struck across the two side posts and the upper lintel beam, red streaks gleaming wet in torchlight, the centre opening left clear. Blood marked on the THREE timbers of the frame — the two uprights and the top beam, NOT the threshold or floor, NOT a painted cross-shape, NOT a modern door</div></figcaption></figure><figure><img src="objects/BOAT.png" loading="lazy"><figcaption><b>BOAT</b> <span class="blk">object</span><div class="c">a small wooden first-century Galilean fishing boat, broad open hull of overlapping planks, single low mast and furled sail, a low rail and wooden stern. A modest lake working-boat — NOT a large ship, NOT a modern dinghy or motorboat</div></figcaption></figure><figure><img src="objects/BREAD.png" loading="lazy"><figcaption><b>BREAD</b> <span class="blk">object</span><div class="c">a single round flat loaf of ancient Near-Eastern bread, pale and dense, hand-formed and flat — the plain daily bread of the ancient Near East, NOT a modern risen sliced loaf, NOT a baguette or bagel</div></figcaption></figure><figure><img src="objects/BRONZE_SERPENT_STANDARD.png" loading="lazy"><figcaption><b>BRONZE_SERPENT_STANDARD</b> <span class="blk">object</span><div class="c">a single cast-bronze serpent SET UPON THE VERY TOP of a tall straight BARE wooden pole, its bronze body and head lifted high like a banner; the long lower shaft is plain bare wood and the serpent does NOT coil, spiral, wind or wrap around the pole — NOT a snake-wound staff, NOT a caduceus or Rod of Asclepius, NOT a spear-tip or flag/banner-topped standard, planted upright in the wilderness ground — a serpent set upon a pole for all the people to look upon</div></figcaption></figure><figure><img src="objects/BUNDLE_OF_WOOD.png" loading="lazy"><figcaption><b>BUNDLE_OF_WOOD</b> <span class="blk">object</span><div class="c">a bound bundle of split firewood for the burnt offering, rough dry branches lashed together with cord, sized to be carried on a young man&#x27;s shoulders. The wood Isaac bore up Moriah — NOT finished lumber or planks, NOT a tidy fireplace stack</div></figcaption></figure><figure><img src="objects/CAESAR_TEMPLE.png" loading="lazy"><figcaption><b>CAESAR_TEMPLE</b> <span class="blk">object</span><div class="c">a gleaming white marble Greco-Roman temple to Caesar perched on a rocky height, fluted columns and a triangular pediment above broad steps, classical and imperial. The pagan temple at Caesarea Philippi — NOT a Hebrew temple, NOT a Buddhist or Egyptian shrine; a Greco-Roman columned marble temple</div></figcaption></figure><figure><img src="objects/CASTING_LOTS.png" loading="lazy"><figcaption><b>CASTING_LOTS</b> <span class="blk">object</span><div class="c">small marked casting-lots — rough bone or wooden dice and a scatter of flat inscribed pebbles — thrown and lying on bare ground, mid-decision, the ancient way of letting chance fall. A handful of crude period gaming-lots tossed down — NOT modern numbered playing dice, NOT a board game, NOT cards</div></figcaption></figure><figure><img src="objects/CHARCOAL_FIRE.png" loading="lazy"><figcaption><b>CHARCOAL_FIRE</b> <span class="blk">object</span><div class="c">a low heap of glowing charcoal coals burning on bare lakeshore sand at dawn, thin grey smoke rising, a few black-and-orange embers among grey ash — a small open ground fire of coals, NOT a built fire-pit, NOT logs or a bonfire</div></figcaption></figure><figure><img src="objects/CHARIOT.png" loading="lazy"><figcaption><b>CHARIOT</b> <span class="blk">object</span><div class="c">an ancient horse-drawn travelling chariot, a light open two-wheeled wooden car drawn by a horse, dust rising on a desert road. A period processional chariot — NOT a Roman war-chariot bristling with blades, NOT a cart or wagon</div></figcaption></figure><figure><img src="objects/COAT_OF_MANY_COLOURS.png" loading="lazy"><figcaption><b>COAT_OF_MANY_COLOURS</b> <span class="blk">object</span><div class="c">a long ankle-length ornate tunic of hand-woven wool in rich bands of crimson, ochre, indigo and saffron stripes, with full sleeves — a costly ancient Hebrew robe of favour, here torn and bloodstained, NOT a modern patchwork coat, NOT a short jacket</div></figcaption></figure><figure><img src="objects/CROSS.png" loading="lazy"><figcaption><b>CROSS</b> <span class="blk">object</span><div class="c">a tall rough-hewn unfinished wooden Roman execution cross, two heavy hand-split timbers fixed in a plain T or Latin shape, the upright planted into the ground and the crossbeam lashed and pegged across it, bark-flecked and splintered, weathered grey-brown. A first-century instrument of death — NOT a smooth polished modern crucifix, NOT a gilded or jewelled church cross, NOT a thin geometric symbol; no figure of Christ on it (bare cross)</div></figcaption></figure><figure><img src="objects/CUSHION.png" loading="lazy"><figcaption><b>CUSHION</b> <span class="blk">object</span><div class="c">a worn leather stern cushion, a single stuffed hide pillow darkened with use, resting in the back of a fishing boat where a man might lay his head. The helmsman&#x27;s cushion Jesus slept on — NOT a soft modern throw pillow, NOT embroidered fabric</div></figcaption></figure><figure><img src="objects/DOORWAY.png" loading="lazy"><figcaption><b>DOORWAY</b> <span class="blk">object</span><div class="c">a plain mud-brick house doorway with two rough wooden side-posts and a wooden lintel beam across the top, the timber and stone smeared with streaks of red lamb&#x27;s blood — an ancient Hebrew dwelling entrance, NOT a panelled modern door, NOT a hinged carved gate</div></figcaption></figure><figure><img src="objects/DROPPED_STONES.png" loading="lazy"><figcaption><b>DROPPED_STONES</b> <span class="blk">object</span><div class="c">rough execution stones left lying unthrown on the dusty temple ground, abandoned where the accusers dropped them and went away — the stones no hand would now cast (John 8:7-9)</div></figcaption></figure><figure><img src="objects/DRY_PIT.png" loading="lazy"><figcaption><b>DRY_PIT</b> <span class="blk">object</span><div class="c">an empty waterless cistern dug into rock, a deep narrow stone-lined pit with a dark dry floor and a small round mouth of light above, no water within. The well Joseph was cast into — NOT a stone water-well with a bucket, NOT a grave, dry and empty</div></figcaption></figure><figure><img src="objects/EGYPTIAN_CHARIOT.png" loading="lazy"><figcaption><b>EGYPTIAN_CHARIOT</b> <span class="blk">object</span><div class="c">a light two-wheeled ancient Egyptian chariot of gilded wood with a curved front rail and spoked wheels, a yoke-pole for horses extending forward — a governor&#x27;s processional chariot, NOT a Roman war chariot, NOT a heavy cart or wagon</div></figcaption></figure><figure><img src="objects/FIERY_SERPENTS.png" loading="lazy"><figcaption><b>FIERY_SERPENTS</b> <span class="blk">object</span><div class="c">venomous desert vipers writhing low among bare rocks and sand, lean and reddish-bronze, mouths open and striking, their bite burning like fire. Living biting wilderness snakes of the Numbers plague — NOT a single bronze idol, NOT cartoon snakes, NOT a coiled staff serpent</div></figcaption></figure><figure><img src="objects/FIRE_TORCH.png" loading="lazy"><figcaption><b>FIRE_TORCH</b> <span class="blk">object</span><div class="c">a clay firepan holding live orange coals and small flames carried by hand, glowing embers with curling smoke — the kept ember-fire borne up the mountain for the offering, NOT a flaming wooden torch, NOT a modern lantern</div></figcaption></figure><figure><img src="objects/FORBIDDEN_FRUIT.png" loading="lazy"><figcaption><b>FORBIDDEN_FRUIT</b> <span class="blk">object</span><div class="c">a single ripe round fruit with one dark bite taken from it, skin glistening, hanging or resting amid green Eden foliage — an unnamed garden fruit of the tree of knowledge, NOT specifically a red apple, NOT a modern orchard apple</div></figcaption></figure><figure><img src="objects/GLEANED_BARLEY.png" loading="lazy"><figcaption><b>GLEANED_BARLEY</b> <span class="blk">object</span><div class="c">a small gathered handful of golden barley stalks with bearded grain heads, loose ears scattered on the stubble of a harvested field — the leftover scraps a gleaner gathers behind reapers, NOT a full sheaf, NOT modern wheat</div></figcaption></figure><figure><img src="objects/GOLDEN_CALF_DUST.png" loading="lazy"><figcaption><b>GOLDEN_CALF_DUST</b> <span class="blk">object</span><div class="c">a small molten-gold idol of a young bull-calf, ground and crushed to glinting gold powder strewed upon water to be drunk — a graven image reduced to dust, NOT an intact statue, NOT a full-grown ox</div></figcaption></figure><figure><img src="objects/GOPHER_WOOD.png" loading="lazy"><figcaption><b>GOPHER_WOOD</b> <span class="blk">object</span><div class="c">stacked rough-hewn beams of dense ancient gopher-wood timber, the cut faces and joints coated dark with sticky black pitch within and without — ancient hand-adzed structural timbers, NOT sawn modern planks, NOT painted lumber</div></figcaption></figure><figure><img src="objects/GRAIN_AND_BREAD.png" loading="lazy"><figcaption><b>GRAIN_AND_BREAD</b> <span class="blk">object</span><div class="c">a mound of golden threshed wheat grain beside round flat dark-crusted loaves of ancient unleavened bread — stored Egyptian grain and life-giving loaves, NOT modern sliced loaves, NOT risen bakery bread</div></figcaption></figure><figure><img src="objects/GRAIN_SACKS.png" loading="lazy"><figcaption><b>GRAIN_SACKS</b> <span class="blk">object</span><div class="c">coarse woven sacks bulging with golden wheat grain, tied at the necks and stacked in a storehouse, some open spilling grain — the stored harvest of Egypt under famine, NOT modern paper sacks, NOT plastic bags</div></figcaption></figure><figure><img src="objects/GREAT_FISH.png" loading="lazy"><figcaption><b>GREAT_FISH</b> <span class="blk">object</span><div class="c">a vast dark sea-creature breaching the storm-black deep, its enormous gaping mouth open to swallow a man whole, immense and shadowed, scales or smooth hide glistening. The great fish the LORD prepared (Jonah 1:17) — a single colossal beast, NOT a friendly cartoon whale, NOT a sea-monster with horns, awe and dread not whimsy</div></figcaption></figure><figure><img src="objects/HARP.png" loading="lazy"><figcaption><b>HARP</b> <span class="blk">object</span><div class="c">a small ancient Israelite lyre (kinnor) of warm wood, a wooden frame with a soundbox and a span of taut strings across two upright arms and a yoke-bar — a hand-held shepherd&#x27;s lyre, NOT a tall orchestral concert harp, NOT a modern pedal harp</div></figcaption></figure><figure><img src="objects/HIGH_PRIEST_GOLD_GARMENTS.png" loading="lazy"><figcaption><b>HIGH_PRIEST_GOLD_GARMENTS</b> <span class="blk">object</span><div class="c">the ornate golden vestments of the Hebrew high priest displayed on a plain wooden stand with NO person wearing them and NO head or face at all, NO Egyptian Pharaoh nemes headdress: a blue robe hemmed with bells and pomegranates, a gold-threaded ephod, and a jewelled breastplate of twelve gemstones, and resting above the robe a Hebrew priestly white linen turban/mitre with a small gold plate; garments of gold and glory, NOT plain linen, NOT a bishop&#x27;s mitre or cope, NOT Egyptian</div></figcaption></figure><figure><img src="objects/HIGH_PRIEST_LINEN_GARMENT.png" loading="lazy"><figcaption><b>HIGH_PRIEST_LINEN_GARMENT</b> <span class="blk">object</span><div class="c">a plain undyed white linen tunic, sash, breeches and turban-mitre, simple and servant-humble, with no gold and no jewels — the Day of Atonement linen the high priest wore into the holy place, NOT the gold ephod and breastplate, NOT an ornate robe</div></figcaption></figure><figure><img src="objects/HOUSE_DOOR.png" loading="lazy"><figcaption><b>HOUSE_DOOR</b> <span class="blk">object</span><div class="c">an ancient Hebrew dwelling doorway of mud-brick with rough timber side-posts and lintel, the wood streaked with smeared red lamb&#x27;s blood — a household entrance marked for the Passover, NOT a panelled modern door, NOT a city gate</div></figcaption></figure><figure><img src="objects/HYSSOP_BRANCH.png" loading="lazy"><figcaption><b>HYSSOP_BRANCH</b> <span class="blk">object</span><div class="c">a small bundled bunch of leafy green hyssop sprigs tied at the stem, the leaves and tips dripping dark red where dipped in blood — a humble cleansing herb used as a brush, NOT a long staff, NOT a leafy tree branch</div></figcaption></figure><figure><img src="objects/ISAIAH_SCROLL.png" loading="lazy"><figcaption><b>ISAIAH_SCROLL</b> <span class="blk">object</span><div class="c">an aged parchment scroll of the prophet Isaiah, partly unrolled between two wooden rollers, dense columns of right-to-left ancient Hebrew script in faded brown ink on yellowed cracked vellum. A long single rolled scroll, not bound pages — NOT a modern book or codex, NOT Latin or printed type</div></figcaption></figure><figure><img src="objects/LAMB.png" loading="lazy"><figcaption><b>LAMB</b> <span class="blk">object</span><div class="c">a silent young unblemished lamb with clean white wool, head bowed and meek, a spotless male of the first year led without struggle. The sacrificial Lamb of Scripture — NOT a fluffy modern toy lamb, NOT a cartoon, NOT a grown horned ram; gentle, real, and pure</div></figcaption></figure><figure><img src="objects/MANNA.png" loading="lazy"><figcaption><b>MANNA</b> <span class="blk">object</span><div class="c">Small pale bread-flakes like coriander seed and white frost, scattered loose and lying flat on bare desert sand in a thin even layer across the ground. Tiny dry round grains resting flat on the surface of the sand. Bare empty desert floor at dawn, soft light, no people.</div></figcaption></figure><figure><img src="objects/MERCY_SEAT.png" loading="lazy"><figcaption><b>MERCY_SEAT</b> <span class="blk">object</span><div class="c">a solid gold lid upon the ark, with two facing winged golden cherubim arching their wings over the centre, gleaming in the thick darkness of the holy of holies — the atonement cover, NOT a throne chair, NOT a plain golden box lid</div></figcaption></figure><figure><img src="objects/MOSES_ROD.png" loading="lazy"><figcaption><b>MOSES_ROD</b> <span class="blk">object</span><div class="c">a long straight rough shepherd&#x27;s staff of weathered olive wood, plain and unadorned, worn smooth by the hand — the rod of Moses&#x27; wilderness works, NOT a snake-wrapped staff, NOT an ornate royal sceptre</div></figcaption></figure><figure><img src="objects/NOAHS_ARK.png" loading="lazy"><figcaption><b>NOAHS_ARK</b> <span class="blk">object</span><div class="c">Noah&#x27;s ark: a colossal rectangular chest-like wooden ark built of pitch-blackened gopher-wood planks, shaped like an enormous flat-sided floating BOX with a long low pitched gable roof running its whole length and a SINGLE large square doorway set high in one long flat side — NOT a sailing ship, NOT a boat with a curved or pointed hull, NOT a shed, cabin or house, resting whole upon dry land, shown in full from the side so the one high door, the long box hull and the roof are all clearly visible</div></figcaption></figure><figure><img src="objects/ONE_DOOR.png" loading="lazy"><figcaption><b>ONE_DOOR</b> <span class="blk">object</span><div class="c">the single great wooden door cut into the towering side of Noah&#x27;s ark, one massive plank-and-pitch portal in a vast dark hull, the only way in. A solitary ark-door — NOT a house door, NOT a city gate, NOT multiple doors; one entrance only</div></figcaption></figure><figure><img src="objects/PAGAN_SHRINE.png" loading="lazy"><figcaption><b>PAGAN_SHRINE</b> <span class="blk">object</span><div class="c">a tall red rock cliff face honeycombed with carved arched niches holding Greco-Roman idols, the grotto of Pan at Caesarea Philippi — a pagan Hellenistic shrine wall, NOT a Buddhist statue, NOT a Hebrew altar</div></figcaption></figure><figure><img src="objects/PARCEL_OF_LAND.png" loading="lazy"><figcaption><b>PARCEL_OF_LAND</b> <span class="blk">object</span><div class="c">a small dry plot of stony Judean farmland on a hillside, low boundary stones and parched furrows under open sky — a family field to be redeemed, NOT a fenced modern farm, NOT a green lawn</div></figcaption></figure><figure><img src="objects/PASSOVER_LAMB.png" loading="lazy"><figcaption><b>PASSOVER_LAMB</b> <span class="blk">object</span><div class="c">a young male lamb without blemish of the first year, white-fleeced and whole, kept four days then slain at twilight with not a bone broken. The Passover lamb of Exodus 12 — NOT a fluffy toy lamb, NOT a grown ram, NOT a wounded or broken carcass; perfect and unblemished</div></figcaption></figure><figure><img src="objects/PRISON_CHAINS.png" loading="lazy"><figcaption><b>PRISON_CHAINS</b> <span class="blk">object</span><div class="c">heavy rusted iron fetters and a thick chain with crude ankle and wrist shackles, lying on cold stone — ancient dungeon irons, NOT modern handcuffs, NOT a decorative chain</div></figcaption></figure><figure><img src="objects/RAINBOW.png" loading="lazy"><figcaption><b>RAINBOW</b> <span class="blk">object</span><div class="c">a soft full arc of rainbow colours bending across a washed clearing sky over a rain-soaked world, faint and luminous — God&#x27;s bow of the covenant, NOT a neon or cartoon rainbow, NOT a double prism band</div></figcaption></figure><figure><img src="objects/RAM_IN_THICKET.png" loading="lazy"><figcaption><b>RAM_IN_THICKET</b> <span class="blk">object</span><div class="c">a full-grown ram caught fast by its curled horns in a tangle of dense thornbush, struggling and held, the provided substitute. A mature horned male sheep snagged in scrub — NOT a young lamb, NOT a freely standing animal; clearly trapped by the horns in the thicket</div></figcaption></figure><figure><img src="objects/REDEEMERS_SHOE.png" loading="lazy"><figcaption><b>REDEEMERS_SHOE</b> <span class="blk">object</span><div class="c">a single worn leather ancient sandal plucked off and held out, simple straps and a flat sole — the token of a sealed redemption by the old custom, NOT a modern shoe, NOT a boot</div></figcaption></figure><figure><img src="objects/REDEMPTION_PRICE.png" loading="lazy"><figcaption><b>REDEMPTION_PRICE</b> <span class="blk">object</span><div class="c">a worn leather sandal plucked off and handed over upon a worn stone at the city gate, sealing the kinsman-redeemer purchase (Ruth 4:7-8) — the ancient shoe-custom that confirmed redemption, NOT counted modern money, NOT gold</div></figcaption></figure><figure><img src="objects/RICH_MANS_TOMB.png" loading="lazy"><figcaption><b>RICH_MANS_TOMB</b> <span class="blk">object</span><div class="c">a rich man&#x27;s rock-hewn burial tomb cut into a hillside, a square dark entrance with a great round disc-shaped sealing stone rolled in its channel beside it. A first-century well-made Judean garden tomb — NOT a modern headstone or graveyard, NOT a built mausoleum, NOT an earthen grave</div></figcaption></figure><figure><img src="objects/RING.png" loading="lazy"><figcaption><b>RING</b> <span class="blk">object</span><div class="c">a golden signet ring, a heavy ancient band with a flat engraved seal-face bearing the mark of the household&#x27;s authority. The father&#x27;s signet restored to the son — NOT a modern jewelled wedding ring, NOT a plain thin band; a seal-ring of authority</div></figcaption></figure><figure><img src="objects/ROBE.png" loading="lazy"><figcaption><b>ROBE</b> <span class="blk">object</span><div class="c">the finest festal robe of the house, a long flowing outer garment of rich dyed cloth with woven border-bands, laid out to drape over a returning son&#x27;s shoulders. A best ceremonial mantle of honour — NOT a plain peasant tunic, NOT a modern coat or bathrobe; the costliest robe</div></figcaption></figure><figure><img src="objects/ROMAN_NAIL.png" loading="lazy"><figcaption><b>ROMAN_NAIL</b> <span class="blk">object</span><div class="c">a single large iron Roman crucifixion nail, a hand-forged dark spike some five to seven inches long with a thick squared shank tapering to a brutal point and a rough flat head, pitted and rust-dark. The nail driven through hands and feet — NOT a modern smooth wire nail, NOT a small carpentry tack</div></figcaption></figure><figure><img src="objects/ROMAN_SPEAR.png" loading="lazy"><figcaption><b>ROMAN_SPEAR</b> <span class="blk">object</span><div class="c">a Roman legionary lancea spear, a long straight ash-wood shaft tipped with a leaf-shaped forged iron head, plain and battle-worn — the spear that pierced the Saviour side (John 19:34), NOT a modern blade</div></figcaption></figure><figure><img src="objects/SACRIFICIAL_KNIFE.png" loading="lazy"><figcaption><b>SACRIFICIAL_KNIFE</b> <span class="blk">object</span><div class="c">an ancient bronze sacrificial blade with a worn wooden handle, raised in a hand, the dull metal catching light — a primitive flint-and-bronze knife, NOT a modern steel knife, NOT a sword</div></figcaption></figure><figure><img src="objects/SCROLL.png" loading="lazy"><figcaption><b>SCROLL</b> <span class="blk">object</span><div class="c">an unrolled ancient parchment scroll wound on two wooden rollers, aged yellow-brown vellum bearing columns of hand-inked right-to-left Hebrew script. A generic rolled Scripture scroll — NOT a bound book or codex, NOT printed paper, NOT Latin lettering</div></figcaption></figure><figure><img src="objects/SHAMEFUL_RECORD.png" loading="lazy"><figcaption><b>SHAMEFUL_RECORD</b> <span class="blk">object</span><div class="c">an unrolled ancient parchment scroll or ledger covered in dense dark handwritten marks, the script illegible — a record of past sins, NOT printed modern text, NOT a bound paper book</div></figcaption></figure><figure><img src="objects/SLEEPING_MAT.png" loading="lazy"><figcaption><b>SLEEPING_MAT</b> <span class="blk">object</span><div class="c">a thin worn woven straw sleeping-mat, frayed at the edges, the simple bed-roll of a poor invalid, rolled or being taken up to carry. A humble first-century reed pallet — NOT a modern mattress or yoga mat, NOT a bed-frame</div></figcaption></figure><figure><img src="objects/SPREAD_SKIRT.png" loading="lazy"><figcaption><b>SPREAD_SKIRT</b> <span class="blk">object</span><div class="c">the outstretched corner of a man&#x27;s woven woollen robe, its hem and fringe spread wide as a covering — the kinsman&#x27;s garment-corner of covering and redemption, NOT a skirt of clothing, NOT a blanket</div></figcaption></figure><figure><img src="objects/STORM_TOSSED_SHIP.png" loading="lazy"><figcaption><b>STORM_TOSSED_SHIP</b> <span class="blk">object</span><div class="c">a small ancient single-masted wooden merchant sailing vessel pitching steeply on heaving black storm waves, its lone square sail torn and straining, hull awash and spray flying. An old-world plank-built boat in a tempest — NOT a modern yacht or steamship, NOT a calm sea</div></figcaption></figure><figure><img src="objects/TEMPLE_LAMPS.png" loading="lazy"><figcaption><b>TEMPLE_LAMPS</b> <span class="blk">object</span><div class="c">great golden menorah-lampstands blazing in the temple court at the Feast of Tabernacles, towering branched stands each holding a ring of flaming oil-bowls, light flooding the night court — colossal golden burning lampstands, NOT small handheld lamps, NOT modern candelabra</div></figcaption></figure><figure><img src="objects/TEMPLE_VEIL.png" loading="lazy"><figcaption><b>TEMPLE_VEIL</b> <span class="blk">object</span><div class="c">the great heavy temple curtain before the Holy of Holies — thick woven linen of blue, purple and scarlet with cherubim figured into it, hanging full from ceiling to floor, massive and sealing. The barrier veil of the sanctuary — NOT a thin household drape, NOT a modern theatre curtain; shown whole and intact (its tearing is a separate moment)</div></figcaption></figure><figure><img src="objects/THE_ASS.png" loading="lazy"><figcaption><b>THE_ASS</b> <span class="blk">object</span><div class="c">a small grey ancient Near-Eastern donkey standing saddled with a simple woven blanket and cloth pack, tethered and waiting — a humble pack donkey, NOT a horse, NOT a mule with a modern saddle</div></figcaption></figure><figure><img src="objects/THICKET.png" loading="lazy"><figcaption><b>THICKET</b> <span class="blk">object</span><div class="c">a dense tangle of low dry thornbush and bramble on a bare mountaintop, woody snagging branches matted together. The scrub that held the ram fast — NOT a leafy green hedge, NOT a forest; arid Near-Eastern thornscrub</div></figcaption></figure><figure><img src="objects/THIRTY_PIECES_SILVER.png" loading="lazy"><figcaption><b>THIRTY_PIECES_SILVER</b> <span class="blk">object</span><div class="c">thirty crude hammered ancient silver coins counted out and heaped together, irregular and tarnished — the betrayal-price of Christ, NOT minted modern coins, NOT gold coins</div></figcaption></figure><figure><img src="objects/TREES_OF_GARDEN.png" loading="lazy"><figcaption><b>TREES_OF_GARDEN</b> <span class="blk">object</span><div class="c">a dense cluster of lush green Eden trees with broad leaves and low shadowed boughs, deep undergrowth between the trunks — the thick garden foliage to hide amongst, NOT a sparse orchard, NOT a modern park</div></figcaption></figure><figure><img src="objects/TWENTY_PIECES_SILVER.png" loading="lazy"><figcaption><b>TWENTY_PIECES_SILVER</b> <span class="blk">object</span><div class="c">twenty crude hammered ancient silver coins counted out together, irregular and tarnished — the slave-price paid for Joseph, NOT minted modern coins, NOT gold coins</div></figcaption></figure><figure><img src="objects/VINEGAR_SPONGE.png" loading="lazy"><figcaption><b>VINEGAR_SPONGE</b> <span class="blk">object</span><div class="c">a single soft rounded porous natural sea-sponge, dark brown and dripping wet, soaked through with sour vinegar, lashed with cord directly onto the very TIP of one long slender bare reed stalk and raised upward — the wet sponge IS the only object on the end of the reed. ABSOLUTELY CRITICAL: there is NO cup, NO wine glass, NO tumbler, NO goblet, NO chalice, NO bowl, NO vessel, NO jar, NO container and NO drinking vessel of ANY kind anywhere on, in, near or embedded in the sponge or reed; nothing holds liquid; no glass; the reed tip carries ONLY the bare soaked sponge, nothing else. NOT a modern square cleaning sponge</div></figcaption></figure><figure><img src="objects/WATERPOT.png" loading="lazy"><figcaption><b>WATERPOT</b> <span class="blk">object</span><div class="c">a rounded earthenware clay water jar with a narrow neck and two small handles, left standing at a well&#x27;s stone rim — an ancient Samaritan water vessel, NOT a metal bucket, NOT a glazed modern pot</div></figcaption></figure><figure><img src="objects/WOLF.png" loading="lazy"><figcaption><b>WOLF</b> <span class="blk">object</span><div class="c">a lean predatory wolf prowling in the dark beyond the sheepfold, grey-shadowed with lowered head and gleaming eyes, menace in its crouch. The threat at the gap in the fold — NOT a friendly dog, NOT a cartoon wolf; a real gaunt hunting predator in gloom</div></figcaption></figure></div><h2>PLACE <span class="muted">(41)</span></h2><div class="grid"><figure><img src="places/BARLEY_FIELD.png" loading="lazy"><figcaption><b>BARLEY_FIELD</b> <span class="blk">plate</span><div class="c">the barley fields of Boaz at harvest: broad swathes of ripe golden grain bending in the breeze and stretching to the Judean hills, cut sheaves and stubble rows, low stone boundary walls, warm full sunlight over the gleaning ground</div></figcaption></figure><figure><img src="places/BELLY_OF_THE_FISH.png" loading="lazy"><figcaption><b>BELLY_OF_THE_FISH</b> <span class="blk">plate</span><div class="c">the cold dark interior of the great fish: a cavernous slick chamber of ribbed flesh and dripping membrane, faint sickly phosphorescence in deep gloom, tangled weeds and brine pooling below, a suffocating tomb-like enclosure, the belly of the deep</div></figcaption></figure><figure><img src="places/BETHLEHEM.png" loading="lazy"><figcaption><b>BETHLEHEM</b> <span class="blk">plate</span><div class="c">the ancient hill town of Bethlehem, house of bread: clustered flat-roofed limestone dwellings stacked up a ridge above terraced barley fields, dusty lanes and low stone walls, warm late-afternoon light over the Judean hills, humble and timeless</div></figcaption></figure><figure><img src="places/CITY_GATE.png" loading="lazy"><figcaption><b>CITY_GATE</b> <span class="blk">plate</span><div class="c">the city gate of ancient Bethlehem: a broad stone gateway in the town wall with worn benches and seats set in the recesses, packed dust underfoot, shadowed archways where elders gather, hard bright Judean daylight at the threshold of the town</div></figcaption></figure><figure><img src="places/CLIFF.png" loading="lazy"><figcaption><b>CLIFF</b> <span class="blk">plate</span><div class="c">a towering rock cliff at Caesarea Philippi: a sheer wall of pale weathered limestone rising high, a great dark pagan cave-shrine gaping at its base, tumbled boulders and dry scrub below, cold shadow at the rock face</div></figcaption></figure><figure><img src="places/DESERT_ROAD.png" loading="lazy"><figcaption><b>DESERT_ROAD</b> <span class="blk">plate</span><div class="c">the lonely sunbaked desert road from Jerusalem down toward Gaza: a pale dusty track winding through empty rocky wilderness, scattered scrub and bleached stones, low barren ridges on either hand under a hard bright sky, deserted and still</div></figcaption></figure><figure><img src="places/DOTHAN_FIELD.png" loading="lazy"><figcaption><b>DOTHAN_FIELD</b> <span class="blk">plate</span><div class="c">the open grazing country near Dothan: wide rolling fields of dry grass and stony pasture stretching to low hazy hills, a few scattered scrub trees and a distant dry watering pit, hard bright daylight over the empty herding ground</div></figcaption></figure><figure><img src="places/EDEN_GARDEN.png" loading="lazy"><figcaption><b>EDEN_GARDEN</b> <span class="blk">plate</span><div class="c">the garden of Eden in the cool of the day: lush deep-green trees heavy with fruit, winding clear streams and soft mossy banks, flowering thickets and dappled golden dusk light, a paradise of abundance now shadowed by a faint encroaching gloom</div></figcaption></figure><figure><img src="places/EGYPT_DWELLINGS.png" loading="lazy"><figcaption><b>EGYPT_DWELLINGS</b> <span class="blk">plate</span><div class="c">the mud-brick slave dwellings of Israel in Egypt on the night of the exodus: cramped flat-roofed earthen houses crowded along dark narrow lanes, low doorways and rough timber lintels, faint lamplight at the thresholds under a tense black sky</div></figcaption></figure><figure><img src="places/EGYPT_STREETS_NIGHT.png" loading="lazy"><figcaption><b>EGYPT_STREETS_NIGHT</b> <span class="blk">plate</span><div class="c">the streets of an ancient Egyptian city at midnight: deserted dust lanes between high mud-brick walls and shadowed doorways, a few guttering torches, a heavy oppressive darkness pressing over the silent houses as the night of judgment falls</div></figcaption></figure><figure><img src="places/EGYPT_THRONE_ROOM.png" loading="lazy"><figcaption><b>EGYPT_THRONE_ROOM</b> <span class="blk">plate</span><div class="c">the throne hall of Pharaoh&#x27;s palace in ancient Egypt: a vast columned chamber of painted lotus-capital pillars, polished stone floors and hieroglyph-carved walls, the empty raised throne and dais set in shafts of warm temple light, gold accents and royal grandeur</div></figcaption></figure><figure><img src="places/EGYPTIAN_DUNGEON.png" loading="lazy"><figcaption><b>EGYPTIAN_DUNGEON</b> <span class="blk">plate</span><div class="c">a dark dungeon beneath ancient Egypt: a cramped pit of rough mud-brick and hewn stone deep underground, heavy shadows broken by a single thin shaft of light from a high barred opening, damp walls and bare earthen floor, a cold cell of false condemnation</div></figcaption></figure><figure><img src="places/FAMINE_LAND.png" loading="lazy"><figcaption><b>FAMINE_LAND</b> <span class="blk">plate</span><div class="c">a famine-stricken ancient land: parched cracked earth split into broken plates of dry mud, withered dead stalks and dust devils on the wind, a barren horizon under a pale washed-out sky bleached white with relentless drought, lifeless and starving</div></figcaption></figure><figure><img src="places/FLOOD_WATERS.png" loading="lazy"><figcaption><b>FLOOD_WATERS</b> <span class="blk">plate</span><div class="c">the rising waters of the great flood drowning the whole earth: a boundless grey expanse of storm-churned water beneath an unbroken curtain of driving rain, the last drowned hilltops vanishing, no land and no horizon, judgment poured out over the world</div></figcaption></figure><figure><img src="places/GOLGOTHA.png" loading="lazy"><figcaption><b>GOLGOTHA</b> <span class="blk">plate</span><div class="c">the barren execution hill of Golgotha outside the walls of Jerusalem: a bleak rocky rise of cracked stone and bare dust, the city wall low in the distance, a heavy darkened sky pressing over the place of the skull</div></figcaption></figure><figure><img src="places/GRAIN_FIELD.png" loading="lazy"><figcaption><b>GRAIN_FIELD</b> <span class="blk">plate</span><div class="c">the barley harvest field where Ruth gleaned: tall ripe grain rippling gold to a low ridge of hills, fallen stalks and stubble between the rows, a scattering of bound sheaves, warm bright midday sun over the Bethlehem harvest ground</div></figcaption></figure><figure><img src="places/GREEN_PASTURE.png" loading="lazy"><figcaption><b>GREEN_PASTURE</b> <span class="blk">plate</span><div class="c">an open green pasture beyond the fold: gentle grassy hillsides rolling down to a quiet still stream, scattered shade trees and wildflowers, soft warm light over abundant feeding-ground, a place of safety and rest under a calm sky</div></figcaption></figure><figure><img src="places/HOLY_OF_HOLIES.png" loading="lazy"><figcaption><b>HOLY_OF_HOLIES</b> <span class="blk">plate</span><div class="c">the innermost chamber of the wilderness tabernacle behind the veil: a small windowless sanctuary wrapped in thick darkness, the heavy embroidered curtain drawn across, the golden ark dim within a hovering cloud of presence, a sacred and dreadful stillness</div></figcaption></figure><figure><img src="places/JERUSALEM_CITY.png" loading="lazy"><figcaption><b>JERUSALEM_CITY</b> <span class="blk">plate</span><div class="c">ancient Jerusalem of the Old Testament, about 700 BC: tiers of flat-roofed limestone dwellings and narrow lanes climbing the hill within thick stone walls, the temple mount rising above, dusty courts and cisterns, warm dry daylight over the city of David</div></figcaption></figure><figure><img src="places/JERUSALEM_NIGHT_INTERIOR.png" loading="lazy"><figcaption><b>JERUSALEM_NIGHT_INTERIOR</b> <span class="blk">plate</span><div class="c">the interior of an ancient Jerusalem stone house at night: plain dressed-stone walls, a low stone ledge, a single small clay oil lamp casting warm light into deep darkness, simple period furnishings</div></figcaption></figure><figure><img src="places/JUDAH_WATCHMAN_HEIGHT.png" loading="lazy"><figcaption><b>JUDAH_WATCHMAN_HEIGHT</b> <span class="blk">plate</span><div class="c">a high watchman&#x27;s vantage over the land of Judah:
