<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zacchaeus Test Visuals</title>
<style>:root{--bg:#f4efe6;--fg:#1d1b18;--ok:#2e7d32;--bad:#b3261e}@media (prefers-color-scheme:dark){:root{--bg:#191612;--fg:#f1ece4;--ok:#81c784;--bad:#ff8a80}}
body{background:var(--bg);color:var(--fg);font:21px/1.5 Verdana,Arial,sans-serif;margin:0;padding:16px}main{max-width:1100px;margin:auto}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}img{width:100%;border-radius:10px}.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}</style></head><body><main>

<div class="g">

<div><a href="stills/t2.png"><img src="stills/t2.png"></a><p><b>2. Up the tree</b> <span class="ok">good</span></p></div>
<div><a href="stills/t3.png"><img src="stills/t3.png"></a><p><b>3. He calls his name</b> <b>good (redrawn)</b> — Jesus faces us, looks up. Old one: <a href="stills/t3_v1.png">t3_v1</a>.</p></div>

</div></main></body></html>
