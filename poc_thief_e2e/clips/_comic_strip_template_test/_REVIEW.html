<h1>David & Goliath — dynamic camera pass</h1>
<p class="sub">One continuous camera move per page: hold on the wide shot, rack to the close-up, rack to the reaction, push in hard on the climax. Figures stay frozen the whole time — only camera, light and dust move. Kling3.0 pro, 10s, 9:16.</p>
