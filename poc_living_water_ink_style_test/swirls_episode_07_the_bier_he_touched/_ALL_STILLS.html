<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>All stills — The Bier He Touched</title>
<style>
  body { font-family: Georgia, serif; background: #f4efe6; margin: 0; padding: 24px; color: #2a2420; }
  h1 { font-size: 30px; margin: 0 0 4px; }
  p.sub { font-size: 19px; color: #6b5f52; margin: 0 0 24px; }
  .wrap { max-width: 1100px; margin: 0 auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
  .card { background: #fff; border-radius: 10px; padding: 14px; }
  .card h2 { font-size: 20px; margin: 0 0 10px; }
  .card img { max-width: 100%; border-radius: 6px; border: 1px solid #ddd; display: block; cursor: zoom-in; }
  .lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 99; align-items: center; justify-content: center; padding: 20px; }
  .lightbox img { max-width: 96vw; max-height: 96vh; border-radius: 4px; cursor: zoom-out; }
  .lightbox.open { display: flex; }
</style>
</head>
<body>
<div class="wrap">
  <h1>All 8 stills</h1>
  <p class="sub">"The Bier He Touched" — click any picture to zoom in.</p>
  <div class="grid">
    <div class="card"><h2>Front cover</h2><img src="front_cover.png" onclick="zoom(this)"></div>
    <div class="card"><h2>F01 — the law</h2><img src="swirls_episode_07_the_bier_he_touched_f01_9x16.png" onclick="zoom(this)"></div>
    <div class="card"><h2>F02 — Weep not</h2><img src="swirls_episode_07_the_bier_he_touched_f02_9x16.png" onclick="zoom(this)"></div>
    <div class="card"><h2>F03 — the touch</h2><img src="swirls_episode_07_the_bier_he_touched_f03_9x16.png" onclick="zoom(this)"></div>
    <div class="card"><h2>F04 — Arise</h2><img src="swirls_episode_07_the_bier_he_touched_f04_9x16.png" onclick="zoom(this)"></div>
    <div class="card"><h2>F05 — he sat up</h2><img src="swirls_episode_07_the_bier_he_touched_f05_9x16.png" onclick="zoom(this)"></div>
    <div class="card"><h2>F06 — the other direction</h2><img src="swirls_episode_07_the_bier_he_touched_f06_9x16.png" onclick="zoom(this)"></div>
    <div class="card"><h2>Back cover</h2><img src="back_cover.png" onclick="zoom(this)"></div>
  </div>
</div>
<div class="lightbox" id="lb" onclick="this.classList.remove('open')"><img id="lbimg"></div>
<script>
function zoom(el){document.getElementById('lbimg').src=el.src;document.getElementById('lb').classList.add('open');}
</script>
</body>
</html>
