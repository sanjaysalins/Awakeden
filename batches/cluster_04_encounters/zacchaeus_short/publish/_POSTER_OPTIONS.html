<!doctype html><html><head><meta charset="utf-8"><title>Zacchaeus Poster Options</title>
<style>body{font-family:Verdana,sans-serif;background:#1b1712;color:#f5f0d0;margin:24px;font-size:20px}
h1{font-size:30px}.row{display:flex;gap:20px;flex-wrap:wrap}.c{background:#2a241c;padding:12px;border-radius:10px;width:300px}
.c b{display:block;font-size:26px}.c p{margin:6px 0 10px;font-size:18px}
img{width:300px;cursor:zoom-in;border-radius:6px}
img.z{position:fixed;inset:0;margin:auto;width:auto;max-height:96vh;z-index:9;cursor:zoom-out;box-shadow:0 0 0 100vmax #000c}</style></head><body>
<h1>Zacchaeus poster: 4 options ($0)</h1>
<div class="row">
<div class="c"><b>A</b><p>The one you liked. Two faces.</p><img src="thumbs_poster/poster_9x16.jpg"></div>
<div class="c"><b>B</b><p>Up and down. He is in the tree. Jesus looks up.</p><img src="thumbs_poster/poster_9x16_B.jpg"></div>
<div class="c"><b>C</b><p>Like A, with a question: "Who was looking for whom?"</p><img src="thumbs_poster/poster_9x16_C.jpg"></div>
<div class="c"><b>D</b><p>Huge Jesus face. Small man up in the tree.</p><img src="thumbs_poster/poster_9x16_D.jpg"></div>
</div>
<p>Click a picture to make it big.</p>
<script>document.querySelectorAll('img').forEach(i=>i.onclick=()=>i.classList.toggle('z'))</script>
</body></html>
