<!doctype html><html><head><meta charset="utf-8"><title>Zacchaeus Poster Thumb</title>

<div class="row">
<div class="c"><b>OLD</b><img class="w" src="thumbs/thumb_16x9.jpg"></div>
<div class="c"><b>NEW 16:9 (YouTube)</b><img class="w" src="thumbs_poster/poster_16x9.jpg"></div>
<div class="c"><b>NEW 9:16 (Shorts / TikTok)</b><img class="t" src="thumbs_poster/poster_9x16.jpg"></div>
</div>
<p>Same title words. Faces from our own stills. Cost: $0.</p>
<script>document.querySelectorAll('img').forEach(i=>i.onclick=()=>i.classList.toggle('z'))</script>
</body></html>
