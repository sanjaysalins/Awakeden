<style>
 body{background:#0f0f11;color:#eee;font-family:system-ui,Arial,sans-serif;margin:0;padding:18px 22px 110px}
 h1{font-size:20px;margin:0 0 2px} .sub{color:#9aa;font-size:13px;margin-bottom:14px}

 .q{font-size:12px;margin:2px 0 6px} .q.PASS{color:#6d6} .q.FAIL{color:#e77} .q.none{color:#888}
 .qn{font-size:12px;color:#cb9;background:#141410;border:1px solid #3a3520;border-radius:6px;padding:6px 8px;margin:0 0 8px;white-space:pre-wrap}
 img,video{max-width:100%;width:330px;border-radius:6px;display:block;background:#000}

 textarea{width:100%;box-sizing:border-box;height:52px;background:#111;color:#eee;border:1px solid #444;border-radius:6px;padding:6px;font-size:13px;margin-top:8px}

 #bar button{font-size:14px;padding:8px 16px;border-radius:8px;border:none;background:#3a7;color:#fff;cursor:pointer}
 #out{position:fixed;inset:5%;background:#111;border:1px solid #555;border-radius:10px;padding:16px;display:none;z-index:9;flex-direction:column}
 #out textarea{flex:1;height:auto;background:#0a0a0a;color:#8f8;font-family:monospace}
</style></head><body>
<h1>Stills gate — thirty_pieces_zech11</h1>

<script>
const S=[{"slug": "blood_water_wood", "png": "file:///C:/Users/sanjay/PycharmProjects/JesusInTheBible/batches/cluster_01_cross/thirty_pieces_zech11/visual/blood_water_wood.png", "clip": "file:///C:/Users/sanjay/PycharmProjects/JesusInTheBible/batches/cluster_01_cross/thirty_pieces_zech11/visual/clips/blood_water_wood.mp4", "quality": null, "qnotes": ""}, {"slug": "coin_on_scroll", "png": "file:///C:/Users/sanjay/PycharmProjects/JesusInTheBible/batches/cluster_01_cross/thirty_pieces_zech11/visual/coin_on_scroll.png", "clip": "", "quality": null, "qnotes": ""}, {"slug": "face_on_cross", "png": "file:///C:/Users/sanjay/PycharmProjects/JesusInTheBible/batches/cluster_01_cross/thirty_pieces_zech11/visual/face_on_cross.png", "clip": "file:///C:/Users/sanjay/PycharmProjects/JesusInTheBible/batches/cluster_01_cross/thirty_pieces_zech11/visual/clips/face_on_cross.mp4", "quality": "PASS", "qnotes": "fact-card rebuild 2026-07-10, eye-audited vs fact sheet v2"}, {"slug": "judas_bag_priests", "png": "file:///C:/Users/sanjay/PycharmProjects/JesusInTheBible/batches/cluster_01_cross/thirty_pieces_zech11/visual/judas_bag_priests.png", "clip": "file:///C:/Users/sanjay/PycharmProjects/JesusInTheBible/batches/cluster_01_cross/thirty_pieces_zech11/visual/clips/judas_bag_priests.mp4", "quality": null, "qnotes": ""}, {"slug": "judas_casting_coins", "png": "file:///C:/Users/sanjay/PycharmProjects/JesusInTheBible/batches/cluster_01_cross/thirty_pieces_zech11/visual/judas_casting_coins.png", "clip": "file:///C:/Users/sanjay/PycharmProjects/JesusInTheBible/batches/cluster_01_cross/thirty_pieces_zech11/visual/clips/judas_casting_coins.mp4", "quality": null, "qnotes": ""}, {"slug": "nail_through_hand", "png": "file:///C:/Users/sanjay/PycharmProjects/JesusInTheBible/batches/cluster_01_cross/thirty_pieces_zech11/visual/nail_through_hand.png", "clip": "file:///C:/Users/sanjay/PycharmProjects/JesusInTheBible/batches/cluster_01_cross/thirty_pieces_zech11/visual/clips/nail_through_hand.mp4", "quality": null, "qnotes": ""}, {"slug": "potter_at_wheel", "png": "file:///C:/Users/sanjay/PycharmProjects/JesusInTheBible/batches/cluster_01_cross/thirty_pieces_zech11/visual/potter_at_wheel.png", "clip": "file:///C:/Users/sanjay/PycharmProjects/JesusInTheBible/batches/cluster_01_cross/thirty_pieces_zech11/visual/clips/potter_at_wheel.mp4", "quality": null, "qnotes": ""}, {"slug": "potters_field", "png": "file:///C:/Users/sanjay/PycharmProjects/JesusInTheBible/batches/cluster_01_cross/thirty_pieces_zech11/visual/potters_field.png", "clip": "file:///C:/Users/sanjay/PycharmProjects/JesusInTheBible/batches/cluster_01_cross/thirty_pieces_zech11/visual/clips/potters_field.mp4", "quality": null, "qnotes": ""}, {"slug": "prophet_scroll", "png": "file:///C:/Users/sanjay/PycharmProjects/JesusInTheBible/batches/cluster_01_cross/thirty_pieces_zech11/visual/prophet_scroll.png", "clip": "", "quality": null, "qnotes": ""}, {"slug": "risen_mercy_hand", "png": "file:///C:/Users/sanjay/PycharmProjects/JesusInTheBible/batches/cluster_01_cross/thirty_pieces_zech11/visual/risen_mercy_hand.png", "clip": "file:///C:/Users/sanjay/PycharmProjects/JesusInTheBible/batches/cluster_01_cross/thirty_pieces_zech11/visual/clips/risen_mercy_hand.mp4", "quality": null, "qnotes": ""}, {"slug": "silver_and_blood", "png": "file:///C:/Users/sanjay/PycharmProjects/JesusInTheBible/batches/cluster_01_cross/thirty_pieces_zech11/visual/silver_and_blood.png", "clip": "", "quality": null, "qnotes": ""}, {"slug": "thirty_coins_scatter", "png": "file:///C:/Users/sanjay/PycharmProjects/JesusInTheBible/batches/cluster_01_cross/thirty_pieces_zech11/visual/thirty_coins_scatter.png", "clip": "", "quality": null, "qnotes": ""}, {"slug": "weighing_scales_silver", "png": "file:///C:/Users/sanjay/PycharmProjects/JesusInTheBible/batches/cluster_01_cross/thirty_pieces_zech11/visual/weighing_scales_silver.png", "clip": "", "quality": null, "qnotes": ""}, {"slug": "zechariah_casting", "png": "file:///C:/Users/sanjay/PycharmProject S.forEach(s=>st[s.slug]={decision:null,notes:""});
function render(){const a=document.getElementById('app');a.innerHTML='';
 S.forEach(s=>{const c=document.createElement('div');c.className='card';c.id='c-'+s.slug;
  const qc=s.quality?('q '+s.quality):'q none';const qt=s.quality?('agent quality: '+s.quality):'agent quality: (not scored)';
  const qn=s.qnotes?`<div class="qn">📋 agent audit: ${s.qnotes}</div>`:'';
  c.innerHTML=`<div class="col"><div class="slug">${s.slug}</div><div class="${qc}">${qt}</div>${qn}
   <a href="${s.png}" target="_blank" title="open full-res"><img src="${s.png}"></a></div>
   <div class="col">${s.clip?`<video src="${s.clip}" controls loop muted playsinline></video>`:`<div class="noclip">— no clip yet —</div>`}
   <div class="btns"><button class="a" data-s="${s.slug}">✓ Approve</button><button class="r" data-s="${s.slug}">✗ Needs REBUILD</button></div>
   <textarea data-s="${s.slug}" placeholder="notes (what's wrong / how to rebuild it)"></textarea></div>`;
  a.appendChild(c);});
 document.querySelectorAll('.btns button').forEach(b=>b.onclick=()=>{const s=b.dataset.s;const dec=b.classList.contains('a')?'approve':'reject';
  st[s].decision=dec;const card=document.getElementById('c-'+s);card.className='card '+(dec==='approve'?'approved':'rejected');
  card.querySelectorAll('.a,.r').forEach(x=>x.classList.remove('on'));b.classList.add('on');});
 document.querySelectorAll('textarea[data-s]').forEach(t=>t.oninput=()=>st[t.dataset.s].notes=t.value);}
function exportAll(){const out=S.map(s=>({slug:s.slug,decision:st[s.slug].decision,notes:st[s.slug].notes.trim()||undefined}))
  .filter(x=>x.decision||x.notes);
 document.getElementById('ot').value="STILLS GATE DECISIONS ("+"thirty_pieces_zech11"+")\n"+JSON.stringify(out,null,2);
 document.getElementById('out').style.display='flex';}
function copyOut(){const t=document.getElementById('ot');t.select();document.execCommand('copy');}
render();
</script></body></html>
