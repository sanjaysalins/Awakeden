<!doctype html><meta charset=utf-8><title>probe compare</title><style>body{background:#111;color:#eee;font-family:system-ui;margin:20px}h1{font-size:16px}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}figure{margin:0}img{width:100%;border:1px solid #444;border-radius:6px}figcaption{font-size:12px;color:#ccc;margin-top:4px}.p{color:#8ab;font-size:11px}small{color:#888}</style><h1>Probe matrix — framing (vary only the tested clause)</h1><div class=g><figure><img src="01_1_macro_wound.png" alt="1_macro_wound"><figcaption><b>01 · 1_macro_wound</b> <small>[ok]</small><br><span class=p>EXTREME MACRO close-up filling the whole frame of the crucified Christ&#x27;s open hand (a dark-haired bearded man in his early thirties with a calm Near-Eastern face) against the wooden cross-beam: a dark ragged pierced hole in the centre of the palm with dark red blood running down. Only the hand and the wood, nothing else. Dramatic ink.</span></figcaption></figure><figure><img src="02_2_close_hand_and_face.png" alt="2_close_hand_and_face"><figcaption><b>02 · 2_close_hand_and_face</b> <small>[ok]</small><br><span class=p>CLOSE shot: the crucified Christ&#x27;s face and one outstretched arm (a dark-haired bearded man in his early thirties with a calm Near-Eastern face), the open hand at the beam showing a dark ragged pierced hole in the centre of the palm with dark red blood running down, his head lifted; dark storm sky, one shaft of warm light.</span></figcaption></figure><figure><img src="03_3_medium_waist_up.png" alt="3_medium_waist_up"><figcaption><b>03 · 3_medium_waist_up</b> <small>[ok]</small><br><span class=p>MEDIUM shot, waist up: the crucified Christ on the cross (a dark-haired bearded man in his early thirties with a calm Near-Eastern face, robed at the waist), exactly two arms out along the crossbeam, head lifted, dark storm sky, one shaft of warm light.</span></figcaption></figure><figure><img src="04_4_wide_full_cross.png" alt="4_wide_full_cross"><figcaption><b>04 · 4_wide_full_cross</b> <small>[ok]</small><br><span class=p>WIDE shot: the whole cross with the crucified Christ upon it (a dark-haired bearded man in his early thirties with a calm Near-Eastern face, robed at the waist), the upright planted in the rocky hilltop, a few small soldiers below, black storm sky, shaft of light.</span></figcaption></figure><figure><img src="05_5_epic_vista.png" alt="5_epic_vista"><figcaption><b>05 · 5_epic_vista</b> <small>[ok]</small><br><span class=p>EPIC WIDE VISTA: three crosses small on the dark hill of Golgotha against a vast torn storm sky with one break of gold light, tiny distant figures and a far city skyline below. Awe and scale.</span></figcaption></figure><figure><img src="06_6_busy_scene.png" alt="6_busy_scene"><figcaption><b>06 · 6_busy_scene</b> <small>[ok]</small><br><span class=p>A BUSY crowded scene at the foot of the cross (a dark-haired bearded man in his early thirties with a calm Near-Eastern face above): a dense throng of many soldiers and mourners, scattered spears, helmets, dice, garments, torches, banners — packed with detail.</span></figcaption></figure></div>
