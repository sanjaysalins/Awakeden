rist&#x27;s open right hand (a dark-haired bearded man in his early thirties with a calm Near-Eastern face) held palm-forward flat against the dark wooden beam of the cross, the bare forearm leading back toward his robed shoulder at the frame edge, one shaft of warm light across the palm. In the centre of the palm a dark bleeding nail-wound; the head of the nail is just visible flush within the wound, blood running down.</span></figcaption></figure><figure><img src="04_dark_disc_flush.png" alt="dark_disc_flush"><figcaption><b>04 · dark_disc_flush</b> <small>[skip]</small><br><span class=p>A close reverent study of the crucified Christ&#x27;s open right hand (a dark-haired bearded man in his early thirties with a calm Near-Eastern face) held palm-forward flat against the dark wooden beam of the cross, the bare forearm leading back toward his robed shoulder at the frame edge, one shaft of warm light across the palm. Through the centre of the palm the head of a crucifixion nail shows as a single dark iron disc flush with the skin, blood running from beneath it.</span></figcaption></figure><figure><img src="05_wound_only_no_metal.png" alt="wound_only_no_metal"><figcaption><b>05 · wound_only_no_metal</b> <small>[skip]</small><br><span class=p>A close reverent study of the crucified Christ&#x27;s open right hand (a dark-haired bearded man in his early thirties with a calm Near-Eastern face) held palm-forward flat against the dark wooden beam of the cross, the bare forearm leading back toward his robed shoulder at the frame edge, one shaft of warm light across the palm. In the centre of the palm a dark pierced wound with fresh and dried blood, the nail sunk so deep that no metal stands out from the skin.</span></figcaption></figure><figure><img src="06_blacksmith_broad_head.png" alt="blacksmith_broad_head"><figcaption><b>06 · blacksmith_broad_head</b> <small>[skip]</small><br><span class=p>A close reverent study of the crucified Christ&#x27;s open right hand (a dark-haired e, one shaft of warm light across the palm. In the centre of the palm a dark ragged pierced hole, torn and bleeding, dark red blood running down toward the wrist.</span></figcaption></figure><figure><img src="10_wound_puncture.png" alt="wound_puncture"><figcaption><b>10 · wound_puncture</b> <small>[ok]</small><br><span class=p>A close reverent study of the crucified Christ&#x27;s open right hand (a dark-haired bearded man in his early thirties with a calm Near-Eastern face) held palm-forward flat against the dark wooden beam of the cross, the bare forearm leading back toward his robed shoulder at the frame edge, one shaft of warm light across the palm. A deep round puncture wound in the centre of the palm, rimmed with torn skin and dark clotted blood, a thin trickle of blood running down to the wrist.</span></figcaption></figure></div>
