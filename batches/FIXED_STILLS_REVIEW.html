<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fixed Stills Review — Cross cluster (2026-07-11)</title>
<style>
  :root { color-scheme: dark; }
  body { background:#14100c; color:#e8dfd0; font-family:Segoe UI,Arial,sans-serif; margin:0; padding:24px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:#a89878; font-size:14px; margin-bottom:18px; }
  .bar { position:sticky; top:0; background:#14100cee; padding:10px 0; z-index:5; border-bottom:1px solid #3a3020; margin-bottom:18px; }
  .bar button { background:#7a5c20; color:#fff; border:0; padding:8px 14px; border-radius:6px; font-size:14px; cursor:pointer; margin-right:8px; }
  .bar .count { color:#e8b84b; font-weight:bold; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:18px; }
  .card { background:#1e1812; border:1px solid #3a3020; border-radius:10px; overflow:hidden; }
  .card img { width:100%; display:block; cursor:zoom-in; }
  .meta { padding:10px 12px; }
  .slug { font-weight:bold; font-size:15px; color:#f0e2c0; }
  .pieces { color:#9a8a68; font-size:12px; margin:4px 0; }
  .was { color:#d08a7a; font-size:12px; margin:6px 0 2px; }
  .now { color:#8fba7a; font-size:12px; margin:0 0 8px; }
  .fb { display:flex; gap:6px; align-items:center; margin-top:6px; }
  .fb button { border:0; border-radius:5px; padding:6px 12px; cursor:pointer; font-size:13px; }
  .pass { background:#2f4d26; color:#cfe8bf; } .pass.on { background:#4d8a35; color:#fff; }
  .fix  { background:#4d2a22; color:#e8c0b5; } .fix.on { background:#a04a35; color:#fff; }
  textarea { width:100%; box-sizing:border-box; background:#120e0a; color:#e8dfd0; border:1px solid #3a3020; border-radius:5px; margin-top:6px; padding:6px; font-size:12px; display:none; }
  textarea.show { display:block; }
</style>
</head>
<body>
<h1>Fixed Stills — final check before re-animating</h1>
<div class="sub">8 fixed designs (13 files — shared plates propagate to sibling pieces). Click any image for full-res.
Mark FIX + a note on anything still wrong, then COPY FEEDBACK and paste it in chat. If all PASS, just say <b>approved</b>.</div>
<div class="bar">
  <button onclick="copyFb()">COPY FEEDBACK</button>
  <button onclick="clearFb()" style="background:#444;">clear all</button>
  <span class="count" id="cnt"></span>
</div>
<div class="grid" id="grid"></div>
<script>
const KEY = "jitb_fixed_fb_v1";
const CARDS = [
 {id:"crucifixion_foretold_ps2218/seamless_robe_lots",
  img:"cluster_01_cross/crucifixion_foretold_ps2218/visual/seamless_robe_lots.png",
  slug:"seamless_robe_lots", pieces:"crucifixion_foretold + pierced",
  was:"looked like a wide modern T-shirt, not the garment Jesus wore",
  now:"the long ankle-length seamless tunic (chiton) Jesus actually wore under his outer clothes — one unbroken weave top to hem (John 19:23), held by exactly FOUR soldiers, lots on the stone"},
 {id:"crucifixion_foretold_ps2218/golgotha_hill_wide",
  img:"cluster_01_cross/crucifixion_foretold_ps2218/visual/golgotha_hill_wide.png",
  slug:"golgotha_hill_wide — MORNING", pieces:"crucifixion_foretold + today_paradise, watch_one_hour, woman_behold",
  was:"giant crosses (not biblical); then church-crosses on rooftops; then a halo",
  now:"short Roman posts, feet just above the bystanders, all three stripped to loincloths, no halo, plain skyline"},
 {id:"forsaken_cry_ps221/golgotha_hill_wide",
  img:"cluster_01_cross/forsaken_cry_ps221/visual/golgotha_hill_wide.png",
  slug:"golgotha_hill_wide — DARK (ninth hour)", pieces:"forsaken_cry + into_thy_hands, it_is_finished, pierced",
  was:"giant crosses; then a skyline cross + comet streak + a thief in a shirt",
  now:"smooth black midday sky (Matt 27:45), short posts, all three in loincloths, clean skyline"},
 {id:"forsaken_cry_ps221/bowed_head_finished",
  img:"cluster_01_cross/forsaken_cry_ps221/visual/bowed_head_finished.png",
  slug:"bowed_head_finished", pieces:"forsaken_cry + into_thy_hands, it_is_finished, i_thirst",
  was:"Jesus' hands were not on the cross; you asked for nails",
  now:"hands flat ON the crossbeam with blood from the palm wounds. HONEST NOTE: I tried nails 3 times — the AI keeps drawing hands HOLDING nails or spikes floating in the wood (grotesque). The wounds + blood imply the nails; the wide golgotha shots show the full crucifixion. Flag FIX if you still want me to keep trying"},
 {id:"pierced_zech1210/blood_water_wood",
  img:"cluster_01_cross/pierced_zech1210/visual/blood_water_wood.png",
  slug:"blood_water_wood — SIDE (pierced)", pieces:"pierced only",
  was:"spear looked like it was coming OUT of his chest + rocks on his waist",
  now:"the soldier below thrusts the spear UP from outside INTO his side (John 19:34), blood and water fall, loincloth clean"},
 {id:"pierced_zech1210/mourners_only_son",
  img:"cluster_01_cross/pierced_zech1210/visual/mourners_only_son.png",
  slug:"mourners_only_son", pieces:"pierced only",
  was:"invented dead-son funeral bier (not biblical)",
  now:"mourners LOOK UP at the crucified Christ and weep (Zech 12:10 / John 19:37)"},
 {id:"thirty_pieces_zech11/blood_water_wood",
  img:"cluster_01_cross/thirty_pieces_zech11/visual/blood_water_wood.png",
  slug:"blood_water_wood — FOOT (thirty_pieces)", pieces:"thirty_pieces only",
  was:"bleeding wood + floating mid-air drops",
  now:"blood runs from his pierced hands and feet down the wood, pooling on the stone below"},
 {id:"thirty_pieces_zech11/coin_on_scroll",
  img:"cluster_01_cross/thirty_pieces_zech11/visual/coin_on_scroll.png",
  slug:"coin_on_scroll", pieces:"thirty_pieces only",
  was:"coin was dinner-plate huge",
  now:"one small fingertip-size silver shekel on the scroll, clay oil lamp beside it"},
];
let fb = JSON.parse(localStorage.getItem(KEY) || "{}");
function save(){ localStorage.setItem(KEY, JSON.stringify(fb)); render(); }
function render(){
  const g = document.getElementById("grid"); g.innerHTML = "";
  let n = 0;
  for (const c of CARDS){
    const f = fb[c.id] || {};
    if (f.state === "fix") n++;
    const d = document.createElement("div"); d.className = "card";
    d.innerHTML = `<a href="${c.img}?v=6" target="_blank"><img src="${c.img}?v=6" loading="lazy"></a>
      <div class="meta">
        <div class="slug">${c.slug}</div>
        <div class="pieces">${c.pieces}</div>
        <div class="was">was: ${c.was}</div>
        <div class="now">now: ${c.now}</div>
        <div class="fb">
          <button class="pass ${f.state==="pass"?"on":""}" onclick="mark('${c.id}','pass')">PASS</button>
          <button class="fix ${f.state==="fix"?"on":""}" onclick="mark('${c.id}','fix')">FIX</button>
        </div>
        <textarea class="${f.state==="fix"?"show":""}" placeholder="what is still wrong?"
          onchange="note('${c.id}',this.value)">${f.note||""}</textarea>
      </div>`;
    g.appendChild(d);
  }
  document.getElementById("cnt").textContent = n ? n + " flagged" : "nothing flagged";
}
function mark(id, s){ fb[id] = fb[id] || {}; fb[id].state = (fb[id].state === s ? null : s); save(); }
function note(id, v){ fb[id] = fb[id] || {}; fb[id].note = v; save(); }
function copyFb(){
  const lines = [];
  for (const c of CARDS){
    const f = fb[c.id];
    if (f && f.state === "fix") lines.push(`- ${c.id}: ${f.note || "(no note)"}`);
  }
  const txt = lines.length ? "FIXED-STILLS FEEDBACK\n" + lines.join("\n") : "FIXED-STILLS: all approved";
  navigator.clipboard.writeText(txt).then(()=>alert("copied:\n\n"+txt));
}
function clearFb(){ if(confirm("clear all feedback?")){ fb={}; save(); } }
render();
</script>
</body>
</html>
